<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen overflow-hidden select-none">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Global Socket Instance
        const socket = io(window.location.origin);

        function App() {
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('dc_user');
                return saved ? JSON.parse(saved) : null;
            });

            const [onlineCount, setOnlineCount] = useState(0);
            const [servers, setServers] = useState([]);
            const [activeServerId, setActiveServerId] = useState(null);
            const [activeChannelId, setActiveChannelId] = useState(null);
            const [messages, setMessages] = useState([]);
            const [activeVoiceChannelId, setActiveVoiceChannelId] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [isDeafened, setIsDeafened] = useState(false);

            // Modals state
            const [showAuthModal, setShowAuthModal] = useState(!currentUser);
            const [showCreateServer, setShowCreateServer] = useState(false);
            const [showJoinServer, setShowJoinServer] = useState(false);
            const [showCreateChannel, setShowCreateChannel] = useState(false);
            const [createChannelType, setCreateChannelType] = useState('text');
            const [showInviteModal, setShowInviteModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showMemberList, setShowMemberList] = useState(true);

            // Form States
            const [messageText, setMessageText] = useState('');
            const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
            const [authForm, setAuthForm] = useState({ username: '', password: '', displayName: '' });
            const [authError, setAuthError] = useState('');
            const [serverNameInput, setServerNameInput] = useState('');
            const [inviteCodeInput, setInviteCodeInput] = useState('');
            const [channelNameInput, setChannelNameInput] = useState('');
            const [profileDisplayName, setProfileDisplayName] = useState('');
            const [profileAvatarColor, setProfileAvatarColor] = useState('#6366f1');

            const messagesEndRef = useRef(null);

            // Auto-scroll messages
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Socket Listeners Setup
            useEffect(() => {
                socket.on('connect', () => {
                    if (currentUser) {
                        socket.emit('auth:login', { username: currentUser.username, password: currentUser.password }, (res) => {
                            if (res && res.success) {
                                socket.emit('server:list');
                            }
                        });
                    }
                });

                socket.on('online:count', (data) => {
                    if (data && typeof data.count === 'number') {
                        setOnlineCount(data.count);
                    }
                });

                socket.on('auth:success', (user) => {
                    setCurrentUser(user);
                    localStorage.setItem('dc_user', JSON.stringify(user));
                    setShowAuthModal(false);
                    setAuthError('');
                    setProfileDisplayName(user.displayName || user.username);
                    setProfileAvatarColor(user.avatarColor || '#6366f1');
                    socket.emit('server:list');
                });

                socket.on('auth:error', (err) => {
                    setAuthError(err.error || 'Ошибка авторизации');
                });

                socket.on('server:list', (serverList) => {
                    if (Array.isArray(serverList)) {
                        setServers(serverList);
                        if (serverList.length > 0) {
                            setActiveServerId(prev => {
                                const exists = serverList.some(s => s.id === prev);
                                return exists ? prev : serverList[0].id;
                            });
                        }
                    }
                });

                socket.on('server:updated', (updatedServer) => {
                    if (!updatedServer) return;
                    setServers(prev => {
                        const exists = prev.some(s => s.id === updatedServer.id);
                        if (exists) {
                            return prev.map(s => s.id === updatedServer.id ? updatedServer : s);
                        } else {
                            return [...prev, updatedServer];
                        }
                    });
                });

                socket.on('channel:history', (data) => {
                    if (data && Array.isArray(data.messages)) {
                        setMessages(data.messages);
                    }
                });

                socket.on('message:new', (newMsg) => {
                    if (!newMsg) return;
                    setMessages(prev => {
                        if (prev.some(m => m.id === newMsg.id)) return prev;
                        if (newMsg.channelId === activeChannelId) {
                            return [...prev, newMsg];
                        }
                        return prev;
                    });
                });

                socket.on('message:updated', (updatedMsg) => {
                    if (!updatedMsg) return;
                    setMessages(prev => prev.map(m => m.id === updatedMsg.id ? updatedMsg : m));
                });

                socket.on('user:profile_updated', (user) => {
                    setCurrentUser(user);
                    localStorage.setItem('dc_user', JSON.stringify(user));
                });

                return () => {
                    socket.off('connect');
                    socket.off('online:count');
                    socket.off('auth:success');
                    socket.off('auth:error');
                    socket.off('server:list');
                    socket.off('server:updated');
                    socket.off('channel:history');
                    socket.off('message:new');
                    socket.off('message:updated');
                    socket.off('user:profile_updated');
                };
            }, [currentUser, activeChannelId]);

            // Sync active server and active channel
            const activeServer = servers.find(s => s.id === activeServerId) || servers[0];

            useEffect(() => {
                if (activeServer && activeServer.channels && activeServer.channels.length > 0) {
                    const textChans = activeServer.channels.filter(c => c.type === 'text');
                    if (textChans.length > 0) {
                        const currentValid = textChans.some(c => c.id === activeChannelId);
                        if (!currentValid) {
                            setActiveChannelId(textChans[0].id);
                        }
                    }
                }
            }, [activeServerId, servers]);

            // Fetch channel history when active channel changes
            useEffect(() => {
                if (activeChannelId) {
                    socket.emit('channel:history', { channelId: activeChannelId });
                }
            }, [activeChannelId]);

            // Auth Actions
            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                if (authTab === 'login') {
                    socket.emit('auth:login', { username: authForm.username, password: authForm.password });
                } else {
                    socket.emit('auth:register', {
                        username: authForm.username,
                        password: authForm.password,
                        displayName: authForm.displayName
                    });
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('dc_user');
                setCurrentUser(null);
                setShowAuthModal(true);
                setServers([]);
                setMessages([]);
                setActiveServerId(null);
                setActiveChannelId(null);
                if (activeVoiceChannelId) {
                    socket.emit('voice:leave', { serverId: activeServerId });
                    setActiveVoiceChannelId(null);
                }
            };

            // Server Actions
            const handleCreateServerSubmit = (e) => {
                e.preventDefault();
                if (!serverNameInput.trim()) return;
                socket.emit('server:create', { name: serverNameInput.trim() }, (res) => {
                    if (res && res.success) {
                        setServerNameInput('');
                        setShowCreateServer(false);
                        setActiveServerId(res.server.id);
                    }
                });
            };

            const handleJoinServerSubmit = (e) => {
                e.preventDefault();
                if (!inviteCodeInput.trim()) return;
                socket.emit('server:join_invite', { inviteCode: inviteCodeInput.trim() }, (res) => {
                    if (res && res.success) {
                        setInviteCodeInput('');
                        setShowJoinServer(false);
                        setActiveServerId(res.server.id);
                    } else if (res && res.error) {
                        alert(res.error);
                    }
                });
            };

            // Channel Actions
            const handleCreateChannelSubmit = (e) => {
                e.preventDefault();
                if (!channelNameInput.trim() || !activeServerId) return;
                socket.emit('channel:create', {
                    serverId: activeServerId,
                    name: channelNameInput.trim(),
                    type: createChannelType
                }, (res) => {
                    if (res && res.success) {
                        setChannelNameInput('');
                        setShowCreateChannel(false);
                        if (res.channel.type === 'text') {
                            setActiveChannelId(res.channel.id);
                        }
                    } else if (res && res.error) {
                        alert(res.error);
                    }
                });
            };

            // Message Actions
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!messageText.trim() || !activeChannelId || !activeServerId) return;
                socket.emit('message:send', {
                    serverId: activeServerId,
                    channelId: activeChannelId,
                    text: messageText
                }, (res) => {
                    if (res && res.success) {
                        setMessageText('');
                    }
                });
            };

            const handleToggleReaction = (messageId, reaction) => {
                if (!activeChannelId || !activeServerId) return;
                socket.emit('message:react', {
                    serverId: activeServerId,
                    channelId: activeChannelId,
                    messageId,
                    reaction
                });
            };

            // Voice Actions
            const handleJoinVoice = (channelId) => {
                if (!activeServerId) return;
                if (activeVoiceChannelId === channelId) return;
                socket.emit('voice:join', { serverId: activeServerId, channelId });
                setActiveVoiceChannelId(channelId);
            };

            const handleLeaveVoice = () => {
                if (!activeServerId) return;
                socket.emit('voice:leave', { serverId: activeServerId });
                setActiveVoiceChannelId(null);
            };

            // Profile Actions
            const handleUpdateProfileSubmit = (e) => {
                e.preventDefault();
                socket.emit('user:update_profile', {
                    displayName: profileDisplayName,
                    avatarColor: profileAvatarColor
                }, (res) => {
                    if (res && res.success) {
                        setShowProfileModal(false);
                    }
                });
            };

            // Helper to render user initials for avatar
            const getInitials = (name) => {
                if (!name) return 'U';
                const parts = name.trim().split(' ');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            };

            // User role in active server
            const currentUserMember = activeServer?.members?.find(m => m.userId === currentUser?.id);
            const isAdmin = currentUserMember?.role === 'admin';

            const activeChannel = activeServer?.channels?.find(c => c.id === activeChannelId);

            return (
                <div class="flex h-screen w-screen overflow-hidden bg-slate-900 text-slate-100">

                    {/* 1. LEFTMOST SERVER SIDEBAR */}
                    <div class="w-18 bg-slate-950 flex flex-col items-center py-3 space-y-3 z-20 border-r border-slate-800 shrink-0">
                        {/* App Logo Button */}
                        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-lg shadow-lg hover:rounded-xl transition-all cursor-pointer">
                            DC
                        </div>
                        <div class="w-8 h-0.5 bg-slate-800 rounded"></div>

                        {/* Server Icons List */}
                        <div class="flex-1 w-full flex flex-col items-center space-y-2 overflow-y-auto px-2">
                            {servers.map(srv => {
                                const isActive = srv.id === activeServerId;
                                return (
                                    <div key={srv.id} class="relative group flex items-center">
                                        {/* Active Indicator Bar */}
                                        <div class={`absolute -left-2 w-1.5 bg-indigo-500 rounded-r transition-all ${isActive ? 'h-10' : 'h-0 group-hover:h-5'}`}></div>

                                        <button
                                            onClick={() => setActiveServerId(srv.id)}
                                            class={`w-12 h-12 rounded-3xl flex items-center justify-center font-bold text-sm transition-all ${isActive ? 'bg-indigo-600 text-white rounded-2xl' : 'bg-slate-800 text-slate-200 hover:bg-indigo-600 hover:text-white hover:rounded-2xl'}`}
                                            title={srv.name}
                                        >
                                            {getInitials(srv.name)}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Action Buttons: Create & Join */}
                        <div class="space-y-2 pt-2 border-t border-slate-800 w-full flex flex-col items-center">
                            <button
                                onClick={() => setShowCreateServer(true)}
                                class="w-12 h-12 bg-slate-800 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center font-bold transition-all"
                                title="Создать сервер"
                            >
                                +
                            </button>
                            <button
                                onClick={() => setShowJoinServer(true)}
                                class="w-12 h-12 bg-slate-800 hover:bg-blue-600 text-blue-400 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center font-bold text-xs transition-all"
                                title="Войти по коду"
                            >
                                Вход
                            </button>
                        </div>
                    </div>

                    {/* 2. CHANNELS SIDEBAR */}
                    <div class="w-60 bg-slate-900 flex flex-col border-r border-slate-800 shrink-0">
                        {/* Server Header */}
                        <div class="h-14 border-b border-slate-800 px-4 flex items-center justify-between font-bold text-slate-100 shadow-sm">
                            <span class="truncate max-w-[140px]">{activeServer ? activeServer.name : 'Discord Clone'}</span>
                            {activeServer && (
                                <button
                                    onClick={() => setShowInviteModal(true)}
                                    class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded font-medium border border-slate-700"
                                >
                                    Пригласить
                                </button>
                            )}
                        </div>

                        {/* Channel List */}
                        <div class="flex-1 overflow-y-auto p-3 space-y-4">
                            {/* Text Channels Section */}
                            <div>
                                <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 px-1">
                                    <span>Текстовые каналы</span>
                                    {isAdmin && (
                                        <button
                                            onClick={() => { setCreateChannelType('text'); setShowCreateChannel(true); }}
                                            class="hover:text-slate-100 font-bold px-1"
                                            title="Создать текстовый канал"
                                        >
                                            +
                                        </button>
                                    )}
                                </div>
                                <div class="space-y-0.5">
                                    {activeServer?.channels?.filter(c => c.type === 'text').map(chan => {
                                        const isActive = chan.id === activeChannelId;
                                        return (
                                            <button
                                                key={chan.id}
                                                onClick={() => setActiveChannelId(chan.id)}
                                                class={`w-full text-left px-2.5 py-1.5 rounded flex items-center space-x-2 text-sm font-medium transition-colors ${isActive ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                                            >
                                                <span class="text-slate-500 font-bold">#</span>
                                                <span class="truncate">{chan.name}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Voice Channels Section */}
                            <div>
                                <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 px-1">
                                    <span>Голосовые каналы</span>
                                    {isAdmin && (
                                        <button
                                            onClick={() => { setCreateChannelType('voice'); setShowCreateChannel(true); }}
                                            class="hover:text-slate-100 font-bold px-1"
                                            title="Создать голосовой канал"
                                        >
                                            +
                                        </button>
                                    )}
                                </div>
                                <div class="space-y-1">
                                    {activeServer?.channels?.filter(c => c.type === 'voice').map(chan => {
                                        const isConnected = activeVoiceChannelId === chan.id;
                                        const voiceUsers = activeServer.voiceStates?.[chan.id] || [];

                                        return (
                                            <div key={chan.id} class="space-y-0.5">
                                                <button
                                                    onClick={() => handleJoinVoice(chan.id)}
                                                    class={`w-full text-left px-2.5 py-1.5 rounded flex items-center justify-between text-sm font-medium transition-colors ${isConnected ? 'bg-emerald-950/40 text-emerald-300 border border-emerald-800/40' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                                                >
                                                    <div class="flex items-center space-x-2 truncate">
                                                        <span class="text-slate-500 text-xs font-bold">[V]</span>
                                                        <span class="truncate">{chan.name}</span>
                                                    </div>
                                                    {isConnected && (
                                                        <span class="text-[10px] bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded uppercase">В эфире</span>
                                                    )}
                                                </button>

                                                {/* Users inside this voice channel */}
                                                {voiceUsers.length > 0 && (
                                                    <div class="pl-6 space-y-1 py-0.5">
                                                        {voiceUsers.map(vUser => (
                                                            <div key={vUser.userId} class="flex items-center space-x-2 text-xs text-slate-300">
                                                                <div
                                                                    class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] text-white font-bold"
                                                                    style={{ backgroundColor: vUser.avatarColor }}
                                                                >
                                                                    {getInitials(vUser.displayName)}
                                                                </div>
                                                                <span class="truncate">{vUser.displayName}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* Active Voice Control Bar */}
                        {activeVoiceChannelId && (
                            <div class="bg-slate-950 p-2.5 border-t border-slate-800 space-y-2">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                        <div>
                                            <div class="text-xs font-bold text-emerald-400">Голосовая связь подключена</div>
                                            <div class="text-[11px] text-slate-400 truncate">
                                                {activeServer?.channels?.find(c => c.id === activeVoiceChannelId)?.name}
                                            </div>
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleLeaveVoice}
                                        class="text-xs bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded font-bold"
                                        title="Отключиться"
                                    >
                                        Отключиться
                                    </button>
                                </div>
                                <div class="flex space-x-1 pt-1">
                                    <button
                                        onClick={() => setIsMuted(!isMuted)}
                                        class={`flex-1 text-xs py-1 rounded font-semibold text-center transition-colors ${isMuted ? 'bg-red-900/60 text-red-300 border border-red-700' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                                    >
                                        {isMuted ? 'Микрофон: Выкл' : 'Микрофон: Вкл'}
                                    </button>
                                    <button
                                        onClick={() => setIsDeafened(!isDeafened)}
                                        class={`flex-1 text-xs py-1 rounded font-semibold text-center transition-colors ${isDeafened ? 'bg-red-900/60 text-red-300 border border-red-700' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                                    >
                                        {isDeafened ? 'Звук: Выкл' : 'Звук: Вкл'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Bottom Panel: User Info & Live Online Counter */}
                        <div class="bg-slate-950 p-3 border-t border-slate-800 flex flex-col space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2 min-w-0">
                                    <div
                                        onClick={() => setShowProfileModal(true)}
                                        class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 cursor-pointer hover:opacity-80 transition-opacity"
                                        style={{ backgroundColor: currentUser?.avatarColor || '#6366f1' }}
                                    >
                                        {getInitials(currentUser?.displayName || currentUser?.username)}
                                    </div>
                                    <div class="min-w-0">
                                        <div class="text-xs font-bold text-slate-200 truncate">{currentUser?.displayName || 'Пользователь'}</div>
                                        <div class="text-[11px] text-slate-400 truncate">@{currentUser?.username}</div>
                                    </div>
                                </div>

                                <div class="flex items-center space-x-1 shrink-0">
                                    <button
                                        onClick={() => setShowProfileModal(true)}
                                        class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded font-medium border border-slate-700"
                                        title="Настройки профиля"
                                    >
                                        Профиль
                                    </button>
                                    <button
                                        onClick={handleLogout}
                                        class="text-xs bg-slate-800 hover:bg-red-900/40 text-slate-300 hover:text-red-400 px-2 py-1 rounded font-medium border border-slate-700"
                                        title="Выйти из аккаунта"
                                    >
                                        Выход
                                    </button>
                                </div>
                            </div>

                            {/* EXACT Online Counter String Requested */}
                            <div class="pt-1 border-t border-slate-900 flex items-center space-x-1.5 text-xs text-slate-400 font-medium">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span>В сети: {onlineCount} человек</span>
                            </div>
                        </div>
                    </div>

                    {/* 3. MAIN CHAT AREA */}
                    <div class="flex-1 flex flex-col bg-slate-800 min-w-0">
                        {/* Chat Header */}
                        <div class="h-14 border-b border-slate-700 px-4 flex items-center justify-between bg-slate-800 shrink-0">
                            <div class="flex items-center space-x-2 min-w-0">
                                <span class="text-xl font-bold text-slate-400">#</span>
                                <span class="font-bold text-slate-100 text-base truncate">{activeChannel ? activeChannel.name : 'выберите-канал'}</span>
                                <span class="text-xs text-slate-400 hidden sm:inline pl-2 border-l border-slate-700">Текстовый канал для сообщений</span>
                            </div>

                            <button
                                onClick={() => setShowMemberList(!showMemberList)}
                                class={`text-xs px-2.5 py-1.5 rounded font-semibold border transition-colors ${showMemberList ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'}`}
                            >
                                {showMemberList ? 'Скрыть участников' : 'Участники'}
                            </button>
                        </div>

                        {/* Messages List */}
                        <div class="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.length === 0 ? (
                                <div class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                                    <div class="text-lg font-semibold">Сообщений пока нет</div>
                                    <div class="text-xs">Напишите первое сообщение в канал #{activeChannel?.name || 'основной'}</div>
                                </div>
                            ) : (
                                messages.map(msg => (
                                    <div key={msg.id} class="flex space-x-3 group hover:bg-slate-750 p-1.5 rounded-lg transition-colors">
                                        {/* Avatar */}
                                        <div
                                            class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 mt-0.5"
                                            style={{ backgroundColor: msg.author?.avatarColor || '#6366f1' }}
                                        >
                                            {getInitials(msg.author?.displayName || msg.author?.username)}
                                        </div>

                                        {/* Content */}
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-baseline space-x-2">
                                                <span class="font-bold text-sm text-slate-100">{msg.author?.displayName || 'Пользователь'}</span>
                                                <span class="text-[11px] text-slate-400">@{msg.author?.username}</span>
                                                <span class="text-[10px] text-slate-500">{msg.timestamp}</span>
                                            </div>

                                            <div class="text-sm text-slate-200 mt-1 leading-relaxed break-words">
                                                {msg.content}
                                            </div>

                                            {/* Reaction Pills & Options */}
                                            <div class="flex flex-wrap items-center gap-1.5 mt-2">
                                                {/* Existing reaction badges */}
                                                {msg.reactions && Object.entries(msg.reactions).map(([reaction, userIds]) => {
                                                    const hasReacted = userIds.includes(currentUser?.id);
                                                    return (
                                                        <button
                                                            key={reaction}
                                                            onClick={() => handleToggleReaction(msg.id, reaction)}
                                                            class={`text-xs px-2 py-0.5 rounded-full border flex items-center space-x-1 font-semibold transition-colors ${hasReacted ? 'bg-indigo-900/60 text-indigo-300 border-indigo-500' : 'bg-slate-900/60 text-slate-400 border-slate-700 hover:border-slate-500'}`}
                                                        >
                                                            <span>{reaction}</span>
                                                            <span class="text-[10px] opacity-80">{userIds.length}</span>
                                                        </button>
                                                    );
                                                })}

                                                {/* Quick reaction add buttons */}
                                                <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-1 bg-slate-900/80 px-1 py-0.5 rounded border border-slate-700">
                                                    {['+1', 'Согласен', 'Класс', 'Важно'].map(r => (
                                                        <button
                                                            key={r}
                                                            onClick={() => handleToggleReaction(msg.id, r)}
                                                            class="text-[11px] px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium"
                                                        >
                                                            {r}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Input Box */}
                        <div class="p-4 bg-slate-800 shrink-0">
                            <form onSubmit={handleSendMessage} class="flex items-center space-x-2 bg-slate-900 rounded-lg p-2 border border-slate-700">
                                <input
                                    type="text"
                                    value={messageText}
                                    onChange={(e) => setMessageText(e.target.value)}
                                    placeholder={activeChannel ? `Написать в #${activeChannel.name}...` : 'Выберите канал...'}
                                    disabled={!activeChannel}
                                    class="flex-1 bg-transparent px-2 py-1 text-sm text-slate-100 placeholder-slate-500 focus:outline-none disabled:opacity-50"
                                />
                                <button
                                    type="submit"
                                    disabled={!messageText.trim() || !activeChannel}
                                    class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white px-4 py-1.5 rounded text-xs font-bold transition-colors"
                                >
                                    Отправить
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* 4. RIGHT MEMBER LIST SIDEBAR */}
                    {showMemberList && (
                        <div class="w-60 bg-slate-900 border-l border-slate-800 p-3 overflow-y-auto shrink-0 hidden md:block">
                            {/* Administrators */}
                            <div class="mb-4">
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">
                                    Администраторы — {activeServer?.members?.filter(m => m.role === 'admin').length || 0}
                                </div>
                                <div class="space-y-1">
                                    {activeServer?.members?.filter(m => m.role === 'admin').map(mem => (
                                        <div key={mem.userId} class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-slate-800/50">
                                            <div class="relative">
                                                <div
                                                    class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white"
                                                    style={{ backgroundColor: mem.avatarColor }}
                                                >
                                                    {getInitials(mem.displayName)}
                                                </div>
                                                <div class={`absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-slate-900 ${mem.status === 'online' ? 'bg-emerald-500' : 'bg-slate-500'}`}></div>
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                <div class="text-xs font-semibold text-slate-200 truncate">{mem.displayName}</div>
                                                <div class="text-[10px] text-amber-400 font-medium">Админ</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Members */}
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">
                                    Участники — {activeServer?.members?.filter(m => m.role !== 'admin').length || 0}
                                </div>
                                <div class="space-y-1">
                                    {activeServer?.members?.filter(m => m.role !== 'admin').map(mem => (
                                        <div key={mem.userId} class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-slate-800/50">
                                            <div class="relative">
                                                <div
                                                    class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white"
                                                    style={{ backgroundColor: mem.avatarColor }}
                                                >
                                                    {getInitials(mem.displayName)}
                                                </div>
                                                <div class={`absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-slate-900 ${mem.status === 'online' ? 'bg-emerald-500' : 'bg-slate-500'}`}></div>
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                <div class="text-xs font-medium text-slate-300 truncate">{mem.displayName}</div>
                                                <div class="text-[10px] text-slate-500 truncate">@{mem.username}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALS */}

                    {/* Auth Modal (Login / Register) */}
                    {showAuthModal && (
                        <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-2xl border border-slate-700 overflow-hidden">
                                <div class="p-6">
                                    <div class="text-center mb-6">
                                        <h2 class="text-2xl font-black text-white">Discord Clone</h2>
                                        <p class="text-xs text-slate-400 mt-1">Добро пожаловать в веб-чат</p>
                                    </div>

                                    {/* Tabs */}
                                    <div class="flex border-b border-slate-700 mb-6">
                                        <button
                                            onClick={() => { setAuthTab('login'); setAuthError(''); }}
                                            class={`flex-1 py-2 text-sm font-bold border-b-2 transition-colors ${authTab === 'login' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                                        >
                                            Вход
                                        </button>
                                        <button
                                            onClick={() => { setAuthTab('register'); setAuthError(''); }}
                                            class={`flex-1 py-2 text-sm font-bold border-b-2 transition-colors ${authTab === 'register' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                                        >
                                            Регистрация
                                        </button>
                                    </div>

                                    {authError && (
                                        <div class="mb-4 p-3 bg-red-950/60 border border-red-700 rounded text-xs text-red-300 font-medium">
                                            {authError}
                                        </div>
                                    )}

                                    <form onSubmit={handleAuthSubmit} class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Имя пользователя</label>
                                            <input
                                                type="text"
                                                required
                                                value={authForm.username}
                                                onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                                                class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                                placeholder="user123"
                                            />
                                        </div>

                                        {authTab === 'register' && (
                                            <div>
                                                <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Отображаемое имя</label>
                                                <input
                                                    type="text"
                                                    value={authForm.displayName}
                                                    onChange={(e) => setAuthForm({ ...authForm, displayName: e.target.value })}
                                                    class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                                    placeholder="Иван Иванов"
                                                />
                                            </div>
                                        )}

                                        <div>
                                            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Пароль</label>
                                            <input
                                                type="password"
                                                required
                                                value={authForm.password}
                                                onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                                                class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                                placeholder="••••••••"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded text-sm transition-colors mt-2"
                                        >
                                            {authTab === 'login' ? 'Войти' : 'Зарегистрироваться'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Create Server Modal */}
                    {showCreateServer && (
                        <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-700 p-6">
                                <h3 class="text-xl font-bold text-white mb-2">Создать сервер</h3>
                                <p class="text-xs text-slate-400 mb-4">Придумайте название для нового сервера</p>

                                <form onSubmit={handleCreateServerSubmit} class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Название сервера</label>
                                        <input
                                            type="text"
                                            required
                                            value={serverNameInput}
                                            onChange={(e) => setServerNameInput(e.target.value)}
                                            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            placeholder="Моё Сообщество"
                                        />
                                    </div>

                                    <div class="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowCreateServer(false)}
                                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold"
                                        >
                                            Создать
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Join Server Modal */}
                    {showJoinServer && (
                        <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-700 p-6">
                                <h3 class="text-xl font-bold text-white mb-2">Присоединиться к серверу</h3>
                                <p class="text-xs text-slate-400 mb-4">Введите код приглашения (например, WELCOME)</p>

                                <form onSubmit={handleJoinServerSubmit} class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Код приглашения</label>
                                        <input
                                            type="text"
                                            required
                                            value={inviteCodeInput}
                                            onChange={(e) => setInviteCodeInput(e.target.value)}
                                            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase"
                                            placeholder="WELCOME"
                                        />
                                    </div>

                                    <div class="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowJoinServer(false)}
                                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold"
                                        >
                                            Присоединиться
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Create Channel Modal */}
                    {showCreateChannel && (
                        <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-700 p-6">
                                <h3 class="text-xl font-bold text-white mb-2">Создать канал</h3>

                                <form onSubmit={handleCreateChannelSubmit} class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Тип канала</label>
                                        <div class="flex space-x-2">
                                            <button
                                                type="button"
                                                onClick={() => setCreateChannelType('text')}
                                                class={`flex-1 py-2 px-3 rounded text-xs font-bold border ${createChannelType === 'text' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                                            >
                                                # Текстовый
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCreateChannelType('voice')}
                                                class={`flex-1 py-2 px-3 rounded text-xs font-bold border ${createChannelType === 'voice' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                                            >
                                                [V] Голосовой
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Название канала</label>
                                        <input
                                            type="text"
                                            required
                                            value={channelNameInput}
                                            onChange={(e) => setChannelNameInput(e.target.value)}
                                            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            placeholder="новости"
                                        />
                                    </div>

                                    <div class="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowCreateChannel(false)}
                                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold"
                                        >
                                            Создать канал
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Invite Modal */}
                    {showInviteModal && (
                        <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-700 p-6">
                                <h3 class="text-xl font-bold text-white mb-2">Пригласить друзей</h3>
                                <p class="text-xs text-slate-400 mb-4">Поделитесь этим кодом приглашения, чтобы другие могли присоединиться</p>

                                <div class="bg-slate-900 p-3 rounded border border-slate-700 flex items-center justify-between mb-4">
                                    <span class="text-lg font-mono font-bold tracking-widest text-indigo-400">
                                        {activeServer?.inviteCode || 'N/A'}
                                    </span>
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(activeServer?.inviteCode || '');
                                            alert('Код скопирован в буфер обмена!');
                                        }}
                                        class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-bold"
                                    >
                                        Скопировать код
                                    </button>
                                </div>

                                <div class="flex justify-end">
                                    <button
                                        onClick={() => setShowInviteModal(false)}
                                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold"
                                    >
                                        Закрыть
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Profile Settings Modal */}
                    {showProfileModal && (
                        <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-700 p-6">
                                <h3 class="text-xl font-bold text-white mb-2">Настройки профиля</h3>

                                <form onSubmit={handleUpdateProfileSubmit} class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Отображаемое имя</label>
                                        <input
                                            type="text"
                                            required
                                            value={profileDisplayName}
                                            onChange={(e) => setProfileDisplayName(e.target.value)}
                                            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Цвет аватарки</label>
                                        <div class="flex space-x-2 pt-1">
                                            {['#6366f1', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#14b8a6'].map(color => (
                                                <button
                                                    key={color}
                                                    type="button"
                                                    onClick={() => setProfileAvatarColor(color)}
                                                    class={`w-8 h-8 rounded-full border-2 transition-transform ${profileAvatarColor === color ? 'border-white scale-110' : 'border-transparent hover:scale-105'}`}
                                                    style={{ backgroundColor: color }}
                                                />
                                            ))}
                                        </div>
                                    </div>

                                    <div class="flex justify-end space-x-2 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setShowProfileModal(false)}
                                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold"
                                        >
                                            Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
