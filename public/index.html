<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body {
            touch-action: manipulation;
            overscroll-behavior-y: contain;
            height: 100%;
            overflow: hidden;
        }
        .overscroll-contain {
            overscroll-behavior-y: contain;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen overflow-hidden select-none overscroll-contain">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Clean SVG Icon Library (No emojis used anywhere)
        const Icons = {
            Hash: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
                </svg>
            ),
            Speaker: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
            ),
            Mic: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
                </svg>
            ),
            MicOff: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3zM3 3l18 18"/>
                </svg>
            ),
            Headphones: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4a7 7 0 00-7 7v6a3 3 0 003 3h1a1 1 0 001-1v-4a1 1 0 00-1-1H6V11a6 6 0 1112 0v3h-3a1 1 0 00-1 1v4a1 1 0 001 1h1a3 3 0 003-3v-6a7 7 0 00-7-7z"/>
                </svg>
            ),
            HeadphonesOff: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM3 3l18 18"/>
                </svg>
            ),
            Users: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            ),
            Menu: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            ),
            Refresh: () => (
                <svg className="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            ),
            Plus: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
                </svg>
            ),
            Close: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            )
        };

        // Global Socket Instance
        const socket = io(window.location.origin);

        function App() {
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('dc_user');
                return saved ? JSON.parse(saved) : null;
            });

            const [onlineCount, setOnlineCount] = useState(0);
            const [servers, setServers] = useState([]);
            const [activeServerId, setActiveServerId] = useState(null);
            const [activeChannelId, setActiveChannelId] = useState(null);
            const [messages, setMessages] = useState([]);

            // Voice call controls state
            const [activeVoiceChannelId, setActiveVoiceChannelId] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [isDeafened, setIsDeafened] = useState(false);

            // Mobile Responsive Drawer States
            const [mobileNavOpen, setMobileNavOpen] = useState(false);
            const [mobileMembersOpen, setMobileMembersOpen] = useState(false);

            // Modals state
            const [showAuthModal, setShowAuthModal] = useState(!currentUser);
            const [showCreateServer, setShowCreateServer] = useState(false);
            const [showJoinServer, setShowJoinServer] = useState(false);
            const [showCreateChannel, setShowCreateChannel] = useState(false);
            const [createChannelType, setCreateChannelType] = useState('text');
            const [showInviteModal, setShowInviteModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showMemberList, setShowMemberList] = useState(true);

            // Form States
            const [messageText, setMessageText] = useState('');
            const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
            const [authForm, setAuthForm] = useState({ username: '', password: '', displayName: '' });
            const [authError, setAuthError] = useState('');
            const [serverNameInput, setServerNameInput] = useState('');
            const [inviteCodeInput, setInviteCodeInput] = useState('');
            const [channelNameInput, setChannelNameInput] = useState('');
            const [profileDisplayName, setProfileDisplayName] = useState('');
            const [profileAvatarColor, setProfileAvatarColor] = useState('#6366f1');

            // Pull-to-refresh state
            const [pullDistance, setPullDistance] = useState(0);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const touchStartYRef = useRef(null);

            const messagesEndRef = useRef(null);
            const messagesContainerRef = useRef(null);

            // Auto-scroll messages
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Socket Listeners Setup
            useEffect(() => {
                socket.on('connect', () => {
                    if (currentUser) {
                        socket.emit('auth:login', { username: currentUser.username, password: currentUser.password }, (res) => {
                            if (res && res.success) {
                                socket.emit('server:list');
                            }
                        });
                    }
                });

                socket.on('online:count', (data) => {
                    if (data && typeof data.count === 'number') {
                        setOnlineCount(data.count);
                    }
                });

                socket.on('auth:success', (user) => {
                    setCurrentUser(user);
                    localStorage.setItem('dc_user', JSON.stringify(user));
                    setShowAuthModal(false);
                    setAuthError('');
                    setProfileDisplayName(user.displayName || user.username);
                    setProfileAvatarColor(user.avatarColor || '#6366f1');
                    socket.emit('server:list');
                });

                socket.on('auth:error', (err) => {
                    setAuthError(err.error || 'Ошибка авторизации');
                });

                socket.on('server:list', (serverList) => {
                    if (Array.isArray(serverList)) {
                        setServers(serverList);
                        if (serverList.length > 0) {
                            setActiveServerId(prev => {
                                const exists = serverList.some(s => s.id === prev);
                                return exists ? prev : serverList[0].id;
                            });
                        }
                    }
                });

                socket.on('server:updated', (updatedServer) => {
                    if (!updatedServer) return;
                    setServers(prev => {
                        const exists = prev.some(s => s.id === updatedServer.id);
                        if (exists) {
                            return prev.map(s => s.id === updatedServer.id ? updatedServer : s);
                        } else {
                            return [...prev, updatedServer];
                        }
                    });
                });

                socket.on('voice:state_update', (data) => {
                    if (!data || !data.serverId) return;
                    setServers(prev => prev.map(s => {
                        if (s.id === data.serverId) {
                            return { ...s, voiceStates: data.voiceStates };
                        }
                        return s;
                    }));
                });

                socket.on('channel:history', (data) => {
                    if (data && Array.isArray(data.messages)) {
                        setMessages(data.messages);
                    }
                });

                socket.on('message:new', (newMsg) => {
                    if (!newMsg) return;
                    setMessages(prev => {
                        if (prev.some(m => m.id === newMsg.id)) return prev;
                        if (newMsg.channelId === activeChannelId) {
                            return [...prev, newMsg];
                        }
                        return prev;
                    });
                });

                socket.on('message:updated', (updatedMsg) => {
                    if (!updatedMsg) return;
                    setMessages(prev => prev.map(m => m.id === updatedMsg.id ? updatedMsg : m));
                });

                socket.on('user:profile_updated', (user) => {
                    setCurrentUser(user);
                    localStorage.setItem('dc_user', JSON.stringify(user));
                });

                return () => {
                    socket.off('connect');
                    socket.off('online:count');
                    socket.off('auth:success');
                    socket.off('auth:error');
                    socket.off('server:list');
                    socket.off('server:updated');
                    socket.off('voice:state_update');
                    socket.off('channel:history');
                    socket.off('message:new');
                    socket.off('message:updated');
                    socket.off('user:profile_updated');
                };
            }, [currentUser, activeChannelId]);

            // Sync active server and active channel
            const activeServer = servers.find(s => s.id === activeServerId) || servers[0];

            useEffect(() => {
                if (activeServer && activeServer.channels && activeServer.channels.length > 0) {
                    const textChans = activeServer.channels.filter(c => c.type === 'text');
                    if (textChans.length > 0) {
                        const currentValid = textChans.some(c => c.id === activeChannelId);
                        if (!currentValid) {
                            setActiveChannelId(textChans[0].id);
                        }
                    }
                }
            }, [activeServerId, servers]);

            // Fetch channel history when active channel changes
            useEffect(() => {
                if (activeChannelId) {
                    socket.emit('channel:history', { channelId: activeChannelId });
                }
            }, [activeChannelId]);

            // Auth Actions
            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                if (authTab === 'login') {
                    socket.emit('auth:login', { username: authForm.username, password: authForm.password });
                } else {
                    socket.emit('auth:register', {
                        username: authForm.username,
                        password: authForm.password,
                        displayName: authForm.displayName
                    });
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('dc_user');
                setCurrentUser(null);
                setShowAuthModal(true);
                setServers([]);
                setMessages([]);
                setActiveServerId(null);
                setActiveChannelId(null);
                if (activeVoiceChannelId) {
                    socket.emit('voice:leave', { serverId: activeServerId });
                    setActiveVoiceChannelId(null);
                }
            };

            // Server Actions
            const handleCreateServerSubmit = (e) => {
                e.preventDefault();
                if (!serverNameInput.trim()) return;
                socket.emit('server:create', { name: serverNameInput.trim() }, (res) => {
                    if (res && res.success) {
                        setServerNameInput('');
                        setShowCreateServer(false);
                        setActiveServerId(res.server.id);
                        setMobileNavOpen(false);
                    }
                });
            };

            const handleJoinServerSubmit = (e) => {
                e.preventDefault();
                if (!inviteCodeInput.trim()) return;
                socket.emit('server:join_invite', { inviteCode: inviteCodeInput.trim() }, (res) => {
                    if (res && res.success) {
                        setInviteCodeInput('');
                        setShowJoinServer(false);
                        setActiveServerId(res.server.id);
                        setMobileNavOpen(false);
                    } else if (res && res.error) {
                        alert(res.error);
                    }
                });
            };

            // Channel Actions
            const handleCreateChannelSubmit = (e) => {
                e.preventDefault();
                if (!channelNameInput.trim() || !activeServerId) return;
                socket.emit('channel:create', {
                    serverId: activeServerId,
                    name: channelNameInput.trim(),
                    type: createChannelType
                }, (res) => {
                    if (res && res.success) {
                        setChannelNameInput('');
                        setShowCreateChannel(false);
                        if (res.channel.type === 'text') {
                            setActiveChannelId(res.channel.id);
                        }
                    } else if (res && res.error) {
                        alert(res.error);
                    }
                });
            };

            // Message Actions
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!messageText.trim() || !activeChannelId || !activeServerId) return;
                socket.emit('message:send', {
                    serverId: activeServerId,
                    channelId: activeChannelId,
                    text: messageText
                }, (res) => {
                    if (res && res.success) {
                        setMessageText('');
                    }
                });
            };

            const handleToggleReaction = (messageId, reaction) => {
                if (!activeChannelId || !activeServerId) return;
                socket.emit('message:react', {
                    serverId: activeServerId,
                    channelId: activeChannelId,
                    messageId,
                    reaction
                });
            };

            // Voice Call Actions
            const handleJoinVoice = (channelId) => {
                if (!activeServerId) return;
                if (activeVoiceChannelId === channelId) return;
                socket.emit('voice:join', {
                    serverId: activeServerId,
                    channelId,
                    isMuted,
                    isDeafened
                });
                setActiveVoiceChannelId(channelId);
            };

            const handleToggleMute = () => {
                const newMute = !isMuted;
                setIsMuted(newMute);
                if (activeVoiceChannelId && activeServerId) {
                    socket.emit('voice:state_update', {
                        serverId: activeServerId,
                        channelId: activeVoiceChannelId,
                        isMuted: newMute,
                        isDeafened
                    });
                }
            };

            const handleToggleDeafen = () => {
                const newDeaf = !isDeafened;
                setIsDeafened(newDeaf);
                if (activeVoiceChannelId && activeServerId) {
                    socket.emit('voice:state_update', {
                        serverId: activeServerId,
                        channelId: activeVoiceChannelId,
                        isMuted,
                        isDeafened: newDeaf
                    });
                }
            };

            const handleLeaveVoice = () => {
                if (!activeServerId) return;
                socket.emit('voice:leave', { serverId: activeServerId });
                setActiveVoiceChannelId(null);
            };

            // Profile Actions
            const handleUpdateProfileSubmit = (e) => {
                e.preventDefault();
                socket.emit('user:update_profile', {
                    displayName: profileDisplayName,
                    avatarColor: profileAvatarColor
                }, (res) => {
                    if (res && res.success) {
                        setShowProfileModal(false);
                    }
                });
            };

            // Pull-To-Refresh Handlers
            const handleTouchStart = (e) => {
                if (messagesContainerRef.current && messagesContainerRef.current.scrollTop <= 0) {
                    touchStartYRef.current = e.touches[0].clientY;
                } else {
                    touchStartYRef.current = null;
                }
            };

            const handleTouchMove = (e) => {
                if (touchStartYRef.current !== null && messagesContainerRef.current && messagesContainerRef.current.scrollTop <= 0) {
                    const currentY = e.touches[0].clientY;
                    const diff = currentY - touchStartYRef.current;
                    if (diff > 0) {
                        const distance = Math.min(diff * 0.45, 70);
                        setPullDistance(distance);
                    }
                }
            };

            const handleTouchEnd = () => {
                if (pullDistance > 40) {
                    setIsRefreshing(true);
                    if (activeChannelId) {
                        socket.emit('channel:history', { channelId: activeChannelId });
                    }
                    socket.emit('server:list');
                    setTimeout(() => {
                        setIsRefreshing(false);
                        setPullDistance(0);
                    }, 700);
                } else {
                    setPullDistance(0);
                }
                touchStartYRef.current = null;
            };

            // Helper to render user initials for avatar
            const getInitials = (name) => {
                if (!name) return 'U';
                const parts = name.trim().split(' ');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            };

            // User role in active server
            const currentUserMember = activeServer?.members?.find(m => m.userId === currentUser?.id);
            const isAdmin = currentUserMember?.role === 'admin';
            const activeChannel = activeServer?.channels?.find(c => c.id === activeChannelId);

            // Reusable Sidebar content component
            const renderSidebarContent = () => (
                <div className="flex h-full w-full">
                    {/* LEFTMOST SERVER COLUMN */}
                    <div className="w-16 bg-slate-950 flex flex-col items-center py-3 space-y-3 z-20 border-r border-slate-800 shrink-0">
                        {/* App Logo Button */}
                        <div className="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-sm shadow-lg hover:rounded-xl transition-all cursor-pointer">
                            DC
                        </div>
                        <div className="w-6 h-0.5 bg-slate-800 rounded"></div>

                        {/* Server Icons List */}
                        <div className="flex-1 w-full flex flex-col items-center space-y-2 overflow-y-auto px-1">
                            {servers.map(srv => {
                                const isActive = srv.id === activeServerId;
                                return (
                                    <div key={srv.id} className="relative group flex items-center">
                                        <div className={`absolute -left-1 w-1 bg-indigo-500 rounded-r transition-all ${isActive ? 'h-8' : 'h-0 group-hover:h-4'}`}></div>
                                        <button
                                            onClick={() => {
                                                setActiveServerId(srv.id);
                                                setMobileNavOpen(false);
                                            }}
                                            className={`w-10 h-10 rounded-3xl flex items-center justify-center font-bold text-xs transition-all ${isActive ? 'bg-indigo-600 text-white rounded-2xl' : 'bg-slate-800 text-slate-200 hover:bg-indigo-600 hover:text-white hover:rounded-2xl'}`}
                                            title={srv.name}
                                        >
                                            {getInitials(srv.name)}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Action Buttons: Create & Join */}
                        <div className="space-y-2 pt-2 border-t border-slate-800 w-full flex flex-col items-center">
                            <button
                                onClick={() => setShowCreateServer(true)}
                                className="w-10 h-10 bg-slate-800 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center font-bold transition-all"
                                title="Создать сервер"
                            >
                                <Icons.Plus />
                            </button>
                            <button
                                onClick={() => setShowJoinServer(true)}
                                className="w-10 h-10 bg-slate-800 hover:bg-blue-600 text-blue-400 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center font-bold text-[10px] transition-all"
                                title="Войти по коду"
                            >
                                Вход
                            </button>
                        </div>
                    </div>

                    {/* CHANNELS COLUMN */}
                    <div className="w-56 bg-slate-900 flex flex-col border-r border-slate-800 shrink-0">
                        {/* Server Header */}
                        <div className="h-14 border-b border-slate-800 px-3 flex items-center justify-between font-bold text-slate-100 shadow-sm">
                            <span className="truncate max-w-[120px] text-sm">{activeServer ? activeServer.name : 'Discord Clone'}</span>
                            {activeServer && (
                                <button
                                    onClick={() => setShowInviteModal(true)}
                                    className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded font-medium border border-slate-700"
                                >
                                    Пригласить
                                </button>
                            )}
                        </div>

                        {/* Channel List */}
                        <div className="flex-1 overflow-y-auto p-2.5 space-y-4">
                            {/* Text Channels Section */}
                            <div>
                                <div className="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 px-1">
                                    <span>Текстовые каналы</span>
                                    {isAdmin && (
                                        <button
                                            onClick={() => { setCreateChannelType('text'); setShowCreateChannel(true); }}
                                            className="hover:text-slate-100 font-bold px-1"
                                            title="Создать текстовый канал"
                                        >
                                            <Icons.Plus />
                                        </button>
                                    )}
                                </div>
                                <div className="space-y-0.5">
                                    {activeServer?.channels?.filter(c => c.type === 'text').map(chan => {
                                        const isActive = chan.id === activeChannelId;
                                        return (
                                            <button
                                                key={chan.id}
                                                onClick={() => {
                                                    setActiveChannelId(chan.id);
                                                    setMobileNavOpen(false);
                                                }}
                                                className={`w-full text-left px-2.5 py-1.5 rounded flex items-center space-x-2 text-xs font-medium transition-colors ${isActive ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                                            >
                                                <Icons.Hash />
                                                <span className="truncate">{chan.name}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Voice Channels Section */}
                            <div>
                                <div className="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 px-1">
                                    <span>Голосовые каналы</span>
                                    {isAdmin && (
                                        <button
                                            onClick={() => { setCreateChannelType('voice'); setShowCreateChannel(true); }}
                                            className="hover:text-slate-100 font-bold px-1"
                                            title="Создать голосовой канал"
                                        >
                                            <Icons.Plus />
                                        </button>
                                    )}
                                </div>
                                <div className="space-y-1">
                                    {activeServer?.channels?.filter(c => c.type === 'voice').map(chan => {
                                        const isConnected = activeVoiceChannelId === chan.id;
                                        const voiceUsers = activeServer.voiceStates?.[chan.id] || [];

                                        return (
                                            <div key={chan.id} className="space-y-0.5">
                                                <button
                                                    onClick={() => handleJoinVoice(chan.id)}

                                <form onSubmit={handleCreateServerSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Название сервера</label>
                                        <input
                                            type="text"
                                            required
                                            value={serverNameInput}
                                            onChange={(e) => setServerNameInput(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            placeholder="Моё Сообщество"
                                        />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowCreateServer(false)}
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold"
                                        >
                                            Создать
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Join Server Modal */}
                    {showJoinServer && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-700 p-5 sm:p-6">
                                <h3 className="text-lg sm:text-xl font-bold text-white mb-1">Присоединиться к серверу</h3>
                                <p className="text-xs text-slate-400 mb-4">Введите код приглашения (например, WELCOME)</p>

                                <form onSubmit={handleJoinServerSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Код приглашения</label>
                                        <input
                                            type="text"
                                            required
                                            value={inviteCodeInput}
                                            onChange={(e) => setInviteCodeInput(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase"
                                            placeholder="WELCOME"
                                        />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowJoinServer(false)}
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold"
                                        >
                                            Присоединиться
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Create Channel Modal */}
                    {showCreateChannel && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-700 p-5 sm:p-6">
                                <h3 className="text-lg sm:text-xl font-bold text-white mb-3">Создать канал</h3>

                                <form onSubmit={handleCreateChannelSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Тип канала</label>
                                        <div className="flex space-x-2">
                                            <button
                                                type="button"
                                                onClick={() => setCreateChannelType('text')}
                                                className={`flex-1 py-2 px-3 rounded-lg text-xs font-bold border flex items-center justify-center space-x-1 ${createChannelType === 'text' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                                            >
                                                <Icons.Hash />
                                                <span>Текстовый</span>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCreateChannelType('voice')}
                                                className={`flex-1 py-2 px-3 rounded-lg text-xs font-bold border flex items-center justify-center space-x-1 ${createChannelType === 'voice' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                                            >
                                                <Icons.Speaker />
                                                <span>Голосовой</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Название канала</label>
                                        <input
                                            type="text"
                                            required
                                            value={channelNameInput}
                                            onChange={(e) => setChannelNameInput(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            placeholder="новости"
                                        />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowCreateChannel(false)}
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold"
                                        >
                                            Создать канал
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Invite Modal */}
                    {showInviteModal && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-700 p-5 sm:p-6">
                                <h3 className="text-lg sm:text-xl font-bold text-white mb-1">Пригласить друзей</h3>
                                <p className="text-xs text-slate-400 mb-4">Поделитесь этим кодом приглашения, чтобы другие могли присоединиться</p>

                                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 flex items-center justify-between mb-4">
                                    <span className="text-lg font-mono font-bold tracking-widest text-indigo-400">
                                        {activeServer?.inviteCode || 'N/A'}
                                    </span>
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(activeServer?.inviteCode || '');
                                            alert('Код скопирован в буфер обмена!');
                                        }}
                                        className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-bold transition-colors"
                                    >
                                        Скопировать код
                                    </button>
                                </div>

                                <div className="flex justify-end">
                                    <button
                                        onClick={() => setShowInviteModal(false)}
                                        className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-bold"
                                    >
                                        Закрыть
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Profile Settings Modal */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-700 p-5 sm:p-6">
                                <h3 className="text-lg sm:text-xl font-bold text-white mb-3">Настройки профиля</h3>

                                <form onSubmit={handleUpdateProfileSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Отображаемое имя</label>
                                        <input
                                            type="text"
                                            required
                                            value={profileDisplayName}
                                            onChange={(e) => setProfileDisplayName(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Цвет аватарки</label>
                                        <div className="flex flex-wrap gap-2 pt-1">
                                            {['#6366f1', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#14b8a6'].map(color => (
                                                <button
                                                    key={color}
                                                    type="button"
                                                    onClick={() => setProfileAvatarColor(color)}
                                                    className={`w-8 h-8 rounded-full border-2 transition-transform ${profileAvatarColor === color ? 'border-white scale-110' : 'border-transparent hover:scale-105'}`}
                                                    style={{ backgroundColor: color }}
                                                />
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setShowProfileModal(false)}
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-bold"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold"
                                        >
                                            Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
