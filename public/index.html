<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<title>Volna</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#fff;--panel:#fff;--chat-bg:#dfe8d6;--text:#000;--sec:#8e8e93;--accent:#3390ec;--border:#e5e5ea;--hover:#f2f2f7;--in:#fff;--out:#eeffde;--outt:#4fae4e;--glass:rgba(255,255,255,.85);--danger:#ff453a;--gold:#e6b800;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[data-theme=dark]{--bg:#0f0f10;--panel:#1c1c1e;--chat-bg:#0e1621;--text:#fff;--accent:#4ea4f6;--border:#2c2c2e;--hover:#2a2a2d;--in:#182533;--out:#2b5278;--outt:#8fc4ee;--glass:rgba(28,28,30,.85)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-size:16px;-webkit-font-smoothing:antialiased}
body{user-select:none;-webkit-touch-callout:none}
input,textarea{user-select:text;font-size:16px;font-family:inherit;outline:none;border:none;background:transparent;color:var(--text)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}50%{transform:translate(-50%,-80%) scale(1.3)}100%{transform:translate(-50%,-150%) scale(.8);opacity:0}}
.auth-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:50}
.auth{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:center;animation:fadeIn .3s}
.logo{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#54a9eb,#3390ec);color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center}
.brand{font-size:30px;font-weight:700}
.sub{color:var(--sec);font-size:15px;text-align:center}
.avp{width:80px;height:80px;border-radius:50%;cursor:pointer;overflow:hidden;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--sec);font-size:30px}
.avp img{width:100%;height:100%;object-fit:cover}
.fld{width:100%;padding:14px 16px;border-radius:12px;background:var(--hover);border:1.5px solid transparent;transition:border-color .2s}
.fld:focus{border-color:var(--accent)}
.btn{width:100%;padding:13px;border-radius:12px;font-size:16px;font-weight:600;border:none;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);color:#fff}
.btn.secondary{background:var(--hover);color:var(--accent)}

#main{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:56px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);z-index:20}
.bsm{font-weight:700;font-size:21px}
.stars{background:var(--hover);padding:5px 12px;border-radius:14px;font-size:14px;font-weight:600;color:var(--gold)}
.ib{width:40px;height:40px;border-radius:50%;font-size:21px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:none;border:none}
.ib:active{background:var(--hover)}
.dd{position:absolute;top:46px;right:0;background:var(--panel);border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:80;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.2);border:.5px solid var(--border);animation:pop .15s;transform-origin:top right}
.dd button{background:none;color:var(--text);padding:12px 14px;text-align:left;border-radius:8px;font-size:16px;border:none;display:flex;gap:12px}
.dd button:hover{background:var(--hover)}
.dd .sep{height:.5px;background:var(--border);margin:4px 0}

.body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
#sb{width:100%;max-width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-right:.5px solid var(--border)}
.sbs{padding:8px 12px}
.sbs input{width:100%;padding:10px 16px;border-radius:20px;background:var(--hover)}
#fl{flex:1;overflow-y:auto}
.fr{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer}
.fr:hover,.fr.act{background:var(--hover)}
.avw{position:relative;flex-shrink:0}
.av{width:54px;height:54px;border-radius:50%;overflow:hidden}
.dot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;background:#34c759;border:2.5px solid var(--panel)}
.fi{flex:1;min-width:0}
.fn{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:600}
.fn span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ft{font-size:13px;font-weight:400;color:var(--sec);flex-shrink:0}
.fl{font-size:15px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

#ca{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--chat-bg)}
.ch{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:56px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--border)}
.avsm{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0}
.cn{font-size:16px;font-weight:600}
.cs{font-size:13px;color:var(--sec)}
.cs.on{color:var(--accent)}
.bk{display:none;background:none;border:none;color:var(--accent);font-size:26px;padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;flex-direction:column;max-width:80%;animation:pop .15s}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.th{align-self:flex-start;align-items:flex-start}
.bub{padding:7px 12px 6px;border-radius:16px;line-height:1.35;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.me .bub{background:var(--out);border-bottom-right-radius:4px}
.th .bub{background:var(--in);border-bottom-left-radius:4px}
.sn{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:2px}
.mt{font-size:12px;color:var(--sec);float:right;margin:6px 0 -2px 10px}
.me .mt{color:var(--outt)}
.rx{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.rx div{background:var(--panel);border:.5px solid var(--border);padding:2px 8px;border-radius:12px;font-size:13px}
.rmenu{position:fixed;background:var(--panel);border-radius:30px;padding:6px 10px;display:flex;gap:4px;box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:250;animation:slideUp .15s}
.rmenu span{font-size:26px;cursor:pointer;padding:4px;transition:transform .15s}
.rmenu span:hover{transform:scale(1.2)}
.heart{position:fixed;font-size:60px;pointer-events:none;z-index:260;animation:floatUp .8s ease-out forwards}
.cmp{display:flex;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--panel);align-items:flex-end;border-top:.5px solid var(--border)}
.mi{flex:1;padding:10px 14px;border-radius:20px;background:var(--hover);min-height:40px;max-height:120px;resize:none;line-height:1.35}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;border:none;flex-shrink:0}
#cempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sec);background:var(--chat-bg)}
#cempty span{background:rgba(0,0,0,.25);color:#fff;padding:6px 14px;border-radius:14px;font-size:14px}

#profileScreen{position:fixed;inset:0;background:var(--hover);z-index:200;display:flex;flex-direction:column;animation:slideUp .2s}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--glass);font-weight:600}
.pt{display:flex;flex-direction:column;align-items:center;padding:20px 16px;background:var(--panel)}
.pav{width:110px;height:110px;border-radius:50%;overflow:hidden;margin-bottom:12px}
.pn{font-size:22px;font-weight:600}
.ps{font-size:15px;color:var(--sec)}.ps.on{color:var(--accent)}
.sec{margin:16px;background:var(--panel);border-radius:12px;overflow:hidden}
.row{padding:12px 16px;border-bottom:.5px solid var(--border)}.row:last-child{border:none}
.row div:first-child{font-size:16px}.row div:last-child{font-size:13px;color:var(--sec);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:400;padding:16px}
.modal.open{display:flex}
.mc{width:100%;max-width:360px;background:var(--panel);border-radius:16px;padding:20px;animation:slideUp .2s;max-height:90vh;overflow-y:auto}
.mtitle{font-size:20px;font-weight:700;text-align:center;margin-bottom:14px}
.tabs{display:flex;background:var(--hover);border-radius:10px;padding:3px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:8px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--sec)}
.tab.active{background:var(--panel);color:var(--text)}
.gm{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.gm:hover{background:var(--hover)}
.gm input{width:20px;height:20px;accent-color:var(--accent)}
.gav{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0}
@media(max-width:700px){#sb{max-width:none}body.co2 #sb{display:none}body:not(.co2) #ca{display:none}.bk{display:block}}
</style>
</head>
<body data-theme="light">

<div id="authScr" class="auth-wrap">
  <div class="auth">
    <div class="logo">🌊</div>
    <h1 class="brand">Volna</h1>
    <p class="sub">Введите имя и пароль.<br>Новое имя — создастся аккаунт.</p>
    <label class="avp"><img id="avPrev" alt="" class="hidden"><span id="avPlus">+</span><input type="file" id="phIn" accept="image/*" hidden></label>
    <input id="nIn" class="fld" placeholder="Ваше имя" maxlength="24" autocomplete="off">
    <input id="pIn" class="fld" type="password" placeholder="Пароль" maxlength="64">
    <button id="aBtn" class="btn primary">Войти / Создать</button>
    <button id="themeBtn" class="btn secondary" style="padding:10px;font-size:14px">Сменить тему</button>
  </div>
</div>

<div id="main" class="hidden">
  <header class="top">
    <div class="bsm">Volna</div>
    <div class="stars">★ <span id="starCount">0</span></div>
    <div style="margin-left:auto;position:relative;display:flex;gap:4px">
      <button id="menuBtn" class="ib" style="color:var(--text)">☰</button>
      <button id="profileBtn" class="ib">👤</button>
      <div id="adM" class="dd hidden">
        <button data-a="addfriend">👥 Добавить друга</button>
        <div class="sep"></div>
        <button data-a="group">💬 Создать группу</button>
        <div class="sep"></div>
        <button data-a="theme">🌓 Сменить тему</button>
        <div class="sep"></div>
        <button id="loBtn" style="color:var(--danger)">🚪 Выйти</button>
      </div>
    </div>
  </header>
  <div class="body">
    <aside id="sb">
      <div class="sbs"><input id="sbSr" placeholder="Поиск"></div>
      <div id="fl"></div>
    </aside>
    <main id="ca">
      <div id="chd" class="ch"></div>
      <div id="msgs" class="msgs"></div>
      <div class="cmp">
        <textarea id="mi" class="mi" placeholder="Сообщение" rows="1"></textarea>
        <button id="sendBtn" class="send">↑</button>
      </div>
      <div id="cempty"><span>Выберите чат, чтобы начать общение</span></div>
    </main>
  </div>
</div>

<div id="profileScreen" class="hidden">
  <div class="nav"><button class="ib" id="profileBack">←</button><div>Профиль</div><div class="ib"></div></div>
  <div id="profileContent" style="flex:1;overflow-y:auto"></div>
</div>

<div id="addFriendModal" class="modal"><div class="mc">
  <h3 class="mtitle">Добавить друга</h3>
  <div class="tabs">
    <div id="tabSearch" class="tab" onclick="switchAddTab('search')">Поиск</div>
    <div id="tabQr" class="tab" onclick="switchAddTab('qr')">Мой QR</div>
    <div id="tabScan" class="tab" onclick="switchAddTab('scan')">Сканер</div>
  </div>
  <div id="viewSearch">
    <input id="searchFriendInput" class="fld" placeholder="Имя или код друга" style="margin-bottom:10px">
    <button class="btn primary" onclick="searchFriend()">Найти</button>
    <div id="searchResult" style="margin-top:12px;max-height:220px;overflow-y:auto"></div>
  </div>
  <div id="viewQr" class="hidden" style="text-align:center">
    <p class="sub" style="margin-bottom:12px">Покажите этот QR-код другу</p>
    <div style="background:#fff;padding:12px;border-radius:16px;display:inline-block"><img id="myQrImg" alt="QR" style="width:180px;height:180px"></div>
    <div id="myCodeText" style="font-size:24px;font-weight:700;letter-spacing:2px;margin:12px 0 8px;color:var(--accent)">------</div>
    <button class="btn secondary" onclick="copyMyCode()" style="padding:8px;font-size:14px">📋 Копировать код</button>
  </div>
  <div id="viewScan" class="hidden">
    <div id="qrReader" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px"></div>
    <p class="sub" style="font-size:13px;margin-top:8px">Наведите камеру на QR-код</p>
  </div>
  <button class="btn secondary" onclick="closeAddFriend()" style="margin-top:14px">Закрыть</button>
</div></div>

<div id="groupModal" class="modal"><div class="mc">
  <h3 class="mtitle">Создать группу</h3>
  <input id="grName" class="fld" placeholder="Название группы" maxlength="40" style="margin-bottom:12px">
  <p class="sub" style="font-size:13px;text-align:left;margin-bottom:6px">Выберите друзей:</p>
  <div id="grMembers" style="max-height:240px;overflow-y:auto;margin-bottom:12px"></div>
  <button class="btn primary" onclick="submitCreateGroup()">Создать</button>
  <button class="btn secondary" onclick="closeGroupModal()" style="margin-top:8px">Отмена</button>
</div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function toast(t){
  const e = document.createElement('div'); e.textContent = t;
  e.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:22px;font-size:15px;z-index:500;max-width:90%;text-align:center';
  document.body.appendChild(e); setTimeout(()=>e.remove(),2500);
}
const fmtTime = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function avFor(n,p){
  if (p) return `<img src="${p}" style="width:100%;height:100%;object-fit:cover">`;
  const raw = (n||'?').trim()||'?', cs=['#3390ec','#e17076','#7bc862','#e5ca77','#6ec9cb','#65aadd','#ee7aae'];
  let x=0; for (const c of raw) x+=c.charCodeAt(0);
  return `<div style="width:100%;height:100%;background:${cs[x%cs.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px">${esc(raw[0].toUpperCase())}</div>`;
}
const applyTheme = t => { document.body.dataset.theme=t; store.set('volna_theme',t); };
const toggleTheme = () => applyTheme(document.body.dataset.theme==='dark'?'light':'dark');
applyTheme(store.get('volna_theme','light'));

const state = {user:null,friends:[],groups:[],messages:{},activeChat:null,activeGroup:null,online:{},qrScanner:null,curTab:'search',pendingAvatar:null};
const activeKey = () => state.activeGroup || state.activeChat;
const socket = io();

socket.on('connect', () => {
  const s = store.get('volna_profile',null);
  if (s) doRegister(s.code, s.name, s.pass, s.photo, true);
});
socket.on('newMessage', ({from,message}) => {
  const key = message.groupId || from;
  const arr = (state.messages[key] ||= []);
  if (!arr.find(m=>m.id===message.id)) arr.push(message);
  if (activeKey()===key) renderMessages();
  renderFriends();
});
socket.on('messageSent', ({to,groupId,message}) => {
  const key = groupId || to;
  const arr = (state.messages[key] ||= []);
  if (!arr.find(m=>m.id===message.id)) arr.push(message);
  if (activeKey()===key) renderMessages();
  renderFriends();
});
socket.on('messageReacted', ({id,reactions}) => {
  let ch=false;
  for (const k in state.messages){ const m=state.messages[k].find(x=>x.id===id); if(m){m.reactions=reactions;ch=true;} }
  if (ch) renderMessages();
});
socket.on('friendOnline', ({code,online}) => { state.online[code]=online; renderFriends(); if(state.activeChat===code) updateChatHeader(); });
socket.on('friendAdded', f => {
  if (!state.friends.find(x=>x.code===f.code)) { state.friends.push(f); state.online[f.code]=f.online; renderFriends(); refreshGroupMembers(); }
});
socket.on('groupAdded', g => {
  if (!state.groups.find(x=>x.id===g.id)) { state.groups.push(g); renderFriends(); }
});

function doRegister(code,name,pass,photo,silent){
  socket.emit('register',{code,name,pass,photo},res => {
    if (!res || !res.ok) {
      if (silent) { store.set('volna_profile',null); $('#authScr').classList.remove('hidden'); $('#main').classList.add('hidden'); }
      return toast('Ошибка: '+(res?.error||'нет связи'));
    }
    state.user=res.user; state.friends=res.friends||[]; state.groups=res.groups||[];
    state.friends.forEach(f=>state.online[f.code]=f.online);
    for (const k in (res.lasts||{})) if (!(state.messages[k]||[]).length) state.messages[k]=[res.lasts[k]];
    store.set('volna_profile',{code:res.user.code,name,pass,photo:res.user.photo});
    $('#authScr').classList.add('hidden'); $('#main').classList.remove('hidden');
    $('#starCount').textContent=res.user.stars;
    renderFriends();
    if (state.activeChat) updateChatHeader();
  });
}
$('#aBtn').onclick = () => {
  const name=$('#nIn').value.trim(), pass=$('#pIn').value;
  if (!name||!pass) return toast('Заполните поля');
  const code = name==='ADMIN' ? 'ADMIN' : Math.random().toString(36).slice(2,8).toUpperCase();
  doRegister(code,name,pass,state.pendingAvatar);
};
$('#pIn').onkeydown = e => { if (e.key==='Enter') $('#aBtn').click(); };
$('#loBtn').onclick = () => { if (confirm('Выйти?')) { store.set('volna_profile',null); location.reload(); } };
$('#themeBtn').onclick = toggleTheme;
$('#phIn').onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload = () => { // уменьшаем аватар до 256px
    const c=document.createElement('canvas'), s=Math.min(256/img.width,256/img.height,1);
    c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    state.pendingAvatar=c.toDataURL('image/jpeg',.8);
    $('#avPrev').src=state.pendingAvatar; $('#avPrev').classList.remove('hidden'); $('#avPlus').classList.add('hidden');
    URL.revokeObjectURL(url);
  };
  img.src=url;
};

/* ---------- список чатов ---------- */
const lastOf = c => { const a=state.messages[c]||[]; return a[a.length-1]; };
function renderFriends(){
  const list=$('#fl'); if(!list||!state.user) return;
  const all=[...state.friends.map(f=>({...f,isGroup:false})),...state.groups.map(g=>({...g,isGroup:true,code:g.id}))];
  all.sort((a,b)=>(lastOf(b.code)?.ts||0)-(lastOf(a.code)?.ts||0));
  if (!all.length) {
    list.innerHTML='<div style="text-align:center;padding:40px;color:var(--sec)">Нет чатов<br><br><button class="btn primary" onclick="openAddFriend()" style="max-width:200px;padding:10px">+ Добавить друга</button></div>';
    return;
  }
  list.innerHTML=all.map(f=>{
    const last=lastOf(f.code);
    let prev='Нет сообщений';
    if (last) prev=(last.from===state.user.code?'Вы: ':'')+(last.text||'📎');
    const act=f.code===activeKey()?' act':'';
    return `<div class="fr${act}" data-code="${esc(f.code)}" onclick="${f.isGroup?'openGroup':'openChat'}('${esc(f.code)}')">
      <div class="avw"><div class="av">${f.isGroup?avFor(f.name,null):avFor(f.name,f.photo)}</div>${!f.isGroup&&state.online[f.code]?'<div class="dot"></div>':''}</div>
      <div class="fi"><div class="fn"><span>${f.isGroup?'👥 ':''}${esc(f.name)}</span><span class="ft">${last?fmtTime(last.ts):''}</span></div>
      <div class="fl">${esc(prev).slice(0,80)}</div></div></div>`;
  }).join('');
  filterList();
}
function filterList(){
  const q=$('#sbSr').value.toLowerCase();
  document.querySelectorAll('#fl .fr').forEach(el=>{ el.style.display=(el.querySelector('.fn span').textContent.toLowerCase().includes(q))?'':'none'; });
}
$('#sbSr').oninput = filterList;

/* ---------- чаты ---------- */
function openChat(code){
  if (!state.friends.find(x=>x.code===code)) return;
  state.activeChat=code; state.activeGroup=null; showChat();
  socket.emit('loadHistory',{withCode:code},res=>{ state.messages[code]=res.history||[]; renderMessages(); renderFriends(); socket.emit('markRead',{withCode:code}); });
}
function openGroup(gid){
  if (!state.groups.find(x=>x.id===gid)) return;
  state.activeGroup=gid; state.activeChat=null; showChat();
  socket.emit('loadHistory',{groupId:gid},res=>{ state.messages[gid]=res.history||[]; renderMessages(); renderFriends(); });
}
function showChat(){
  document.body.classList.add('co2'); $('#cempty').style.display='none';
  $('#msgs').innerHTML=''; updateChatHeader(); renderFriends();
}
function closeChat(){ state.activeChat=state.activeGroup=null; document.body.classList.remove('co2'); $('#cempty').style.display=''; renderFriends(); }
function updateChatHeader(){
  const back='<button class="bk" onclick="closeChat()">←</button>';
  if (state.activeChat){
    const f=state.friends.find(x=>x.code===state.activeChat); if(!f) return;
    const on=state.online[f.code];
    $('#chd').innerHTML=`${back}<div class="avsm">${avFor(f.name,f.photo)}</div><div style="flex:1;cursor:pointer" onclick="openProfile('${esc(f.code)}')"><div class="cn">${esc(f.name)}</div><div class="cs ${on?'on':''}">${on?'в сети':'был(а) недавно'}</div></div>`;
  } else if (state.activeGroup){
    const g=state.groups.find(x=>x.id===state.activeGroup); if(!g) return;
    $('#chd').innerHTML=`${back}<div class="avsm">${avFor(g.name,null)}</div><div style="flex:1"><div class="cn">${esc(g.name)}</div><div class="cs">${g.members.length} участников</div></div>`;
  }
}
function renderMessages(){
  const key=activeKey(); if(!key) return;
  const ms=state.messages[key]||[], a=$('#msgs');
  if (!ms.length){ a.innerHTML='<div style="text-align:center;padding:40px;color:var(--sec)">Напишите первое сообщение</div>'; return; }
  const nearBottom = a.scrollHeight-a.scrollTop-a.clientHeight<150;
  a.innerHTML=ms.map(m=>{
    const mine=m.from===state.user.code;
    const rx=m.reactions&&Object.keys(m.reactions).length?'<div class="rx">'+Object.keys(m.reactions).map(e=>`<div>${e} ${m.reactions[e].length}</div>`).join('')+'</div>':'';
    const who=state.activeGroup&&!mine?`<div class="sn">${esc((state.friends.find(f=>f.code===m.from)||{}).name||m.from)}</div>`:'';
    return `<div class="msg ${mine?'me':'th'}" data-id="${m.id}" ondblclick="quickReact(event,'${m.id}','❤️')" oncontextmenu="showReactionsMenu(event,'${m.id}');return false">
      <div class="bub">${who}${esc(m.text||'')}<span class="mt">${fmtTime(m.ts)}${mine?' ✓✓':''}</span></div>${rx}</div>`;
  }).join('');
  if (nearBottom || ms.length<=1 || ms[ms.length-1].from===state.user.code) a.scrollTop=a.scrollHeight;
}
function quickReact(e,id,emoji){
  e.preventDefault(); socket.emit('reactToMessage',{id,emoji});
  const h=document.createElement('div'); h.className='heart'; h.textContent=emoji;
  h.style.left=e.clientX+'px'; h.style.top=e.clientY+'px';
  document.body.appendChild(h); setTimeout(()=>h.remove(),800);
}
function showReactionsMenu(e,id){
  e.preventDefault(); document.querySelectorAll('.rmenu').forEach(m=>m.remove());
  const menu=document.createElement('div'); menu.className='rmenu';
  menu.innerHTML=['👍','❤️','🔥','😂','😢','🎉'].map(em=>`<span data-em="${em}">${em}</span>`).join('');
  menu.onclick=ev=>{ const s=ev.target.closest('span[data-em]'); if(s){ socket.emit('reactToMessage',{id,emoji:s.dataset.em}); menu.remove(); } };
  menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-270))+'px';
  menu.style.top=Math.max(10,e.clientY-60)+'px';
  document.body.appendChild(menu);
  setTimeout(()=>{ const close=()=>{menu.remove();document.removeEventListener('click',close)}; document.addEventListener('click',close); },50);
}
/* долгое нажатие на телефоне = меню реакций, двойной тап = ❤️ */
let lp, lastTap=0;
$('#msgs').addEventListener('touchstart',e=>{
  const m=e.target.closest('.msg'); if(!m) return; const t=e.touches[0];
  const now=Date.now();
  if (now-lastTap<300){ clearTimeout(lp); quickReact({preventDefault(){},clientX:t.clientX,clientY:t.clientY},m.dataset.id,'❤️'); lastTap=0; return; }
  lastTap=now;
  lp=setTimeout(()=>showReactionsMenu({preventDefault(){},clientX:t.clientX,clientY:t.clientY},m.dataset.id),500);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('#msgs').addEventListener(ev,()=>clearTimeout(lp),{passive:true}));

/* ---------- отправка ---------- */
const mi=$('#mi');
const autoResize=()=>{ mi.style.height='auto'; mi.style.height=Math.min(mi.scrollHeight,120)+'px'; };
mi.addEventListener('input',autoResize);
function send(){
  const t=mi.value.trim(); if(!t) return;
  if (!activeKey()) return toast('Выберите чат');
  const p={kind:'text',text:t};
  state.activeGroup?p.groupId=state.activeGroup:p.to=state.activeChat;
  socket.emit('sendMessage',p);
  mi.value=''; autoResize(); mi.focus();
}
$('#sendBtn').onclick=send;
mi.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };

/* ---------- меню ---------- */
$('#menuBtn').onclick=e=>{ e.stopPropagation(); $('#adM').classList.toggle('hidden'); };
document.addEventListener('click',e=>{ if(!e.target.closest('#adM')&&!e.target.closest('#menuBtn')) $('#adM').classList.add('hidden'); });
$('#adM').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return; $('#adM').classList.add('hidden');
  if (b.dataset.a==='addfriend') openAddFriend();
  else if (b.dataset.a==='group') openGroupModal();
  else if (b.dataset.a==='theme') toggleTheme();
};

/* ---------- профиль ---------- */
function profileHtml(u,self){
  return `<div class="pt"><div class="pav">${avFor(u.name,u.photo)}</div><div class="pn">${esc(u.name)}</div>
    <div class="ps ${u.online?'on':''}">${u.online?'в сети':'был(а) недавно'}</div></div>
    <div class="sec"><div class="row"><div>${esc(u.name)}</div><div>Имя</div></div>
    <div class="row"><div>${esc(u.code)}</div><div>Код пользователя</div></div>
    ${self?`<div class="row"><div>${u.stars||0} ★</div><div>Баланс</div></div>`:''}</div>`;
}
$('#profileBtn').onclick=()=>{ if(!state.user) return; $('#profileContent').innerHTML=profileHtml({...state.user,online:true},true); $('#profileScreen').classList.remove('hidden'); };
$('#profileBack').onclick=()=>$('#profileScreen').classList.add('hidden');
function openProfile(code){
  const f=state.friends.find(x=>x.code===code); if(!f) return;
  $('#profileContent').innerHTML=profileHtml({...f,online:!!state.online[code]},false);
  $('#profileScreen').classList.remove('hidden');
}

/* ---------- друзья ---------- */
function openAddFriend(){ $('#addFriendModal').classList.add('open'); switchAddTab('search'); }
function closeAddFriend(){ $('#addFriendModal').classList.remove('open'); stopQRScanner(); }
function switchAddTab(tab){
  state.curTab=tab;
  [['search','Search'],['qr','Qr'],['scan','Scan']].forEach(([t,n])=>{
    $('#view'+n).classList.toggle('hidden',t!==tab);
    $('#tab'+n).classList.toggle('active',t===tab);
  });
  if (tab==='qr') generateMyQR();
  if (tab==='scan') startQRScanner(); else stopQRScanner();
}
function generateMyQR(){
  if(!state.user) return;
  const code=state.user.code; $('#myCodeText').textContent=code;
  const fb=()=>{ $('#myQrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(code); };
  if (window.QRCode&&QRCode.toDataURL) QRCode.toDataURL(code,{width:180,margin:1},(err,url)=>err?fb():$('#myQrImg').src=url); else fb();
}
function copyMyCode(){
  if(!state.user) return;
  (navigator.clipboard?navigator.clipboard.writeText(state.user.code):Promise.reject())
    .then(()=>toast('Код скопирован: '+state.user.code)).catch(()=>toast('Код: '+state.user.code));
}
function searchFriend(){
  const q=$('#searchFriendInput').value.trim(); if(!q) return toast('Введите имя или код');
  socket.emit('searchUsers',{query:q},res=>{
    const box=$('#searchResult');
    if(!res||!res.ok) return toast('Ошибка поиска');
    if(!res.users.length){ box.innerHTML='<p class="sub" style="padding:16px">Никого не найдено</p>'; return; }
    box.innerHTML=res.users.map(u=>{
      const isF=state.friends.some(f=>f.code===u.code);
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--hover);border-radius:10px;margin-bottom:8px">
        <div class="gav" style="width:44px;height:44px">${avFor(u.name,u.photo)}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(u.name)}</div><div class="sub" style="font-size:13px;text-align:left">${esc(u.code)}</div></div>
        ${isF?'<span class="sub" style="font-size:13px">уже друг</span>':`<button class="btn primary" style="width:auto;padding:8px 14px;font-size:14px" onclick="addFriendByCode('${esc(u.code)}')">+</button>`}</div>`;
    }).join('');
  });
}
function addFriendByCode(code){
  socket.emit('addFriendByCode',{code},res=>{
    if(!res||!res.ok) return toast(res?.error||'Ошибка');
    if(!state.friends.find(x=>x.code===res.friend.code)){ state.friends.push(res.friend); state.online[res.friend.code]=res.friend.online; }
    toast((res.already?'Уже в друзьях: ':'Друг добавлен: ')+res.friend.name);
    renderFriends(); closeAddFriend();
  });
}
function startQRScanner(){
  if (typeof Html5Qrcode==='undefined') return toast('Сканер недоступен');
  if (state.qrScanner) return;
  $('#qrReader').innerHTML='';
  const sc=state.qrScanner=new Html5Qrcode('qrReader');
  sc.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},decoded=>{
    const code=String(decoded||'').trim().toUpperCase(); if(!code) return;
    stopQRScanner(); addFriendByCode(code);
  },()=>{}).catch(()=>{ toast('Камера недоступна. Нужен HTTPS или localhost'); state.qrScanner=null; });
}
function stopQRScanner(){
  const s=state.qrScanner; if(!s) return; state.qrScanner=null;
  try{ s.stop().then(()=>s.clear()).catch(()=>{}); }catch(e){}
}

/* ---------- группы ---------- */
function openGroupModal(){
  if(!state.friends.length) return toast('Сначала добавьте друзей');
  $('#grName').value=''; refreshGroupMembers(); $('#groupModal').classList.add('open');
}
function closeGroupModal(){ $('#groupModal').classList.remove('open'); }
function refreshGroupMembers(){
  $('#grMembers').innerHTML=state.friends.map(f=>`<label class="gm"><input type="checkbox" value="${esc(f.code)}">
    <div class="gav">${avFor(f.name,f.photo)}</div><div style="flex:1;font-weight:600;font-size:15px">${esc(f.name)}</div></label>`).join('');
}
function submitCreateGroup(){
  const name=$('#grName').value.trim(); if(!name) return toast('Введите название');
  const members=[...document.querySelectorAll('#grMembers input:checked')].map(i=>i.value);
  if(!members.length) return toast('Выберите друзей');
  socket.emit('createGroup',{name,members},res=>{
    if(!res||!res.ok) return toast(res?.error||'Ошибка');
    toast('Группа создана'); closeGroupModal();
  });
}
Object.assign(window,{openAddFriend,closeAddFriend,switchAddTab,copyMyCode,searchFriend,addFriendByCode,openChat,openGroup,closeChat,openProfile,quickReact,showReactionsMenu,submitCreateGroup,closeGroupModal});
</script>
</body>
</html>
