<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<title>Volna</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root {
  --bg:#fff; --panel:#fff; --sidebar:#fff; --chat-bg:#f2f2f7;
  --text:#000; --text-secondary:#8e8e93; --accent:#007aff;
  --border:#e5e5ea; --hover:#f2f2f7;
  --bubble-in:#fff; --bubble-out:#e1ffc7;
  --gold:#e6b800; --glass:rgba(255,255,255,0.75);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"] {
  --bg:#000; --panel:#1c1c1e; --sidebar:#000; --chat-bg:#000;
  --text:#fff; --text-secondary:#8e8e93; --accent:#0a84ff;
  --border:#38383a; --hover:#1c1c1e;
  --bubble-in:#262628; --bubble-out:#1e4620;
  --glass:rgba(28,28,30,0.75);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-size:16px;user-select:none;-webkit-font-smoothing:antialiased;}
input,textarea{user-select:text;font-size:16px!important;font-family:inherit;outline:none;border:none;background:transparent;color:var(--text);}
.hidden{display:none!important;}
img,video{display:block;max-width:100%;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes popMsg{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulseOnline{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.6)}50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}

.auth-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:50;}
.auth{width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;align-items:center;}
.brand{font-size:32px;font-weight:700;letter-spacing:-.8px;}
.sub{color:var(--text-secondary);font-size:15px;}
.avp{width:90px;height:90px;border-radius:50%;cursor:pointer;overflow:hidden;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:32px;}
.avp img{width:100%;height:100%;object-fit:cover;}
.fld{width:100%;padding:14px 16px;border-radius:10px;background:var(--hover);font-size:16px;border:1px solid transparent;transition:border-color .2s;}
.fld:focus{border-color:var(--accent);}
.btn{width:100%;padding:14px;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;text-align:center;border:none;transition:transform .1s,opacity .2s;}
.btn:active{transform:scale(.97);opacity:.8;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.secondary{background:var(--hover);color:var(--accent);}

#main{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel);}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;height:56px;flex-shrink:0;z-index:10;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);}
.bsm{font-weight:700;font-size:22px;letter-spacing:-.5px;}
.stars-badge{display:flex;align-items:center;gap:6px;background:var(--hover);padding:6px 14px;border-radius:16px;font-size:15px;font-weight:600;cursor:pointer;margin-left:auto;color:var(--gold);transition:transform .15s;}
.ib{width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent);}
.dd{position:absolute;top:50px;right:16px;background:var(--panel);border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:80;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.18);border:.5px solid var(--border);animation:slideUp .2s;}
.dd button{background:transparent;color:var(--text);padding:12px 16px;text-align:left;border-radius:8px;font-size:16px;display:flex;gap:12px;align-items:center;border:none;font-weight:500;}
.dd button:active{background:var(--hover);}
.dd .sep{height:.5px;background:var(--border);margin:6px 0;}

.body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden;}
#sb{width:100%;max-width:400px;flex-shrink:0;overflow-y:auto;background:var(--sidebar);display:flex;flex-direction:column;border-right:.5px solid var(--border);}
.sbs{padding:8px 16px;background:var(--panel);display:flex;gap:8px;}
.sbs input{flex:1;padding:10px 14px;border-radius:10px;background:var(--hover);font-size:16px;}
#fl{display:flex;flex-direction:column;flex:1;overflow-y:auto;}

.fr{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;position:relative;transition:background .15s;}
.fr:active{background:var(--hover);}
.avw{position:relative;flex-shrink:0;}
.av{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.dot{position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:50%;background:#34c759;border:2px solid var(--sidebar);animation:pulseOnline 2s infinite;}
.fi{flex:1;min-width:0;border-bottom:.5px solid var(--border);padding:10px 0;display:flex;flex-direction:column;justify-content:center;}
.fr:last-child .fi{border-bottom:none;}
.fn{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fl{font-size:15px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

#ca{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--chat-bg);}
.ch{display:flex;align-items:center;gap:12px;padding:8px 16px;height:60px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);flex-shrink:0;}
.avsm{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;}
.avsm img{width:100%;height:100%;object-fit:cover;}
.cn{font-size:17px;font-weight:600;}
.cs{font-size:13px;color:var(--text-secondary);margin-top:1px;}
.bk{display:none;background:none;border:none;color:var(--accent);font-size:24px;padding:8px;}

.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;}
.msg{display:flex;flex-direction:column;max-width:80%;animation:popMsg .2s;position:relative;}
.msg.me{align-self:flex-end;}
.msg.th{align-self:flex-start;}
.bub{padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.4;word-break:break-word;white-space:pre-wrap;}
.me .bub{background:var(--bubble-out);border-bottom-right-radius:4px;}
.th .bub{background:var(--bubble-in);border-bottom-left-radius:4px;border:.5px solid var(--border);}
.mt{font-size:12px;color:var(--text-secondary);margin:4px 4px 0;display:flex;gap:4px;align-items:center;justify-content:flex-end;}
.me .mt{color:#62a03a;}
.reactions-menu{position:fixed;background:var(--panel);border-radius:30px;padding:6px 10px;display:flex;gap:4px;box-shadow:0 8px 32px rgba(0,0,0,.25);z-index:250;animation:slideUp .15s;border:.5px solid var(--border);}
.reactions-menu span{font-size:26px;cursor:pointer;padding:4px;border-radius:50%;transition:transform .15s;}
.float-heart{position:fixed;font-size:60px;pointer-events:none;z-index:260;animation:floatUp .8s ease-out forwards;}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}50%{transform:translate(-50%,-80%) scale(1.3);opacity:1}100%{transform:translate(-50%,-150%) scale(.8);opacity:0}}

.cmp{display:flex;gap:8px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);flex-shrink:0;align-items:flex-end;border-top:.5px solid var(--border);}
.ab{width:36px;height:36px;color:var(--accent);font-size:26px;display:flex;align-items:center;justify-content:center;font-weight:300;background:transparent;border:none;cursor:pointer;}
.mi{flex:1;padding:10px 16px;border-radius:20px;background:var(--hover);font-size:16px;min-height:40px;max-height:120px;resize:none;}
.sb2{width:36px;height:36px;color:var(--accent);font-size:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;}

#profileScreen{position:fixed;inset:0;background:var(--sidebar);z-index:200;display:flex;flex-direction:column;animation:slideInRight .3s;}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--glass);backdrop-filter:blur(20px);height:56px;flex-shrink:0;}
.nav-title{font-size:17px;font-weight:600;}
.profile-scroll{flex:1;overflow-y:auto;padding-bottom:40px;}
.profile-top{display:flex;flex-direction:column;align-items:center;padding:10px 16px 20px;}
.profile-avatar{width:110px;height:110px;border-radius:50%;background:var(--accent);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:600;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-size:22px;font-weight:600;margin-bottom:4px;}
.profile-status{font-size:15px;color:var(--text-secondary);}
.profile-status.online{color:var(--accent);}
.tg-section{margin:16px 16px 0;background:var(--panel);border-radius:12px;overflow:hidden;animation:slideUp .3s;}
.tg-row{display:flex;align-items:center;padding:12px 16px;position:relative;cursor:pointer;}
.tg-row:active{background:var(--hover);}
.tg-row:not(:last-child)::after{content:'';position:absolute;bottom:0;left:16px;right:0;height:.5px;background:var(--border);}
.tg-row-content{flex:1;display:flex;flex-direction:column;gap:2px;}
.tg-row-main{font-size:17px;color:var(--text);}
.tg-row-sub{font-size:14px;color:var(--text-secondary);}
.tg-section-title{font-size:14px;font-weight:600;color:var(--accent);margin:24px 16px 8px;text-transform:uppercase;}
</style><body data-theme="light">

<div id="authScr" class="auth-wrap"><div class="auth">
<h1 class="brand">Volna</h1>
<p class="sub">Введите имя и пароль</p>
<label class="avp" id="avPick"><img id="avPrev" alt="" style="display:none"><span id="avPlus">+</span><input type="file" id="phIn" accept="image/*" hidden></label>

</div></div>

<header class="top">

<div class="bsm">Volna</div>

<div style="margin-left:auto;position:relative;">
<div id="adM" class="dd hidden">
<button data-a="addfriend">👥 Добавить друга</button>
<div class="sep"></div>
<button data-a="group">💬 Создать группу</button>

</div>

</aside>
<main id="ca">

  <div class="nav-bar">

<div id="addFriendModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:400;padding:16px;">
  <div style="width:100%;max-width:360px;background:var(--panel);border-radius:16px;padding:20px;border:0.5px solid var(--border);animation:slideUp 0.2s;">
    <h3 style="font-size:20px;font-weight:700;text-align:center;margin-bottom:16px;">Добавить друга</h3>
    <div style="display:flex;background:var(--hover);border-radius:10px;padding:4px;margin-bottom:16px;">
      <div id="tabSearch" onclick="switchAddTab('search')" style="flex:1;text-align:center;padding:8px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--panel);color:var(--text);">Поиск</div>
      <div id="tabQR" onclick="switchAddTab('qr')" style="flex:1;text-align:center;padding:8px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--text-secondary);">Мой QR</div>
      <div id="tabScan" onclick="switchAddTab('scan')" style="flex:1;text-align:center;padding:8px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--text-secondary);">Сканер</div>
    </div>

    <div id="viewSearch">
      <input id="searchFriendInput" class="fld" placeholder="Введите имя или код друга" style="margin-bottom:12px;">
      <button class="btn primary" onclick="searchFriend()">Найти</button>
      <div id="searchResult" style="margin-top:12px;max-height:200px;overflow-y:auto;"></div>
    </div>

    <div id="viewQR" class="hidden" style="text-align:center;">
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">Покажите этот QR-код другу</p>
      <div style="background:#fff;padding:16px;border-radius:16px;display:inline-block;">
        <img id="myQrImg" alt="QR" style="width:180px;height:180px;display:block;">
      </div>
      <div style="margin-top:16px;">
        <div id="myCodeText" style="font-size:24px;font-weight:700;letter-spacing:2px;margin-bottom:8px;color:var(--accent);">------</div>
        <button class="btn secondary" onclick="copyMyCode()" style="padding:8px 16px;font-size:14px;">📋 Копировать код</button>
      </div>

      <div id="qrReader" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:250px;"></div>

<input type="file" id="phF" accept="image/*" hidden><script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const store = { get(k,d){ try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };
const toast = t => { const e=document.createElement('div'); e.textContent=t; e.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 22px;border-radius:22px;font-size:15px;font-weight:500;z-index:500;backdrop-filter:blur(10px);'; document.body.appendChild(e); setTimeout(()=>e.remove(),2500); };
const fmtTime = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

const avFor = (n,p) => {
  if (p) return `<img src="${p}" style="width:100%;height:100%;object-fit:cover">`;
  const raw = (n||'?').trim() || '?';
  const l = raw.charAt(0).toUpperCase();
  const cs = ['#007aff','#ff3b30','#34c759','#ff9500','#5856d6','#af52de','#ff2d55'];
  let x = 0; for (const c of raw) x += c.charCodeAt(0) || 0;
  return `<div style="width:100%;height:100%;background:${cs[x % cs.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600">${esc(l)}</div>`;
};

let socket = null;
const state = { user:null, friends:[], groups:[], messages:{}, activeChat:null, activeGroup:null, online:{}, qrScanner:null, curTab:'search' };

const savedTheme = store.get('volna_theme','light');
document.body.setAttribute('data-theme', savedTheme);

socket = io();

socket.on('connect', () => {
  const saved = store.get('volna_profile', null);
  if (saved) doRegister(saved.code, saved.name, saved.pass, saved.photo);
});
socket.on('newMessage', ({ from, message }) => {
  if (message.groupId) {
    (state.messages[message.groupId] = state.messages[message.groupId]||[]).push(message);
    if (state.activeGroup === message.groupId) renderMessages();
  } else {
    (state.messages[from] = state.messages[from]||[]).push(message);
    if (state.activeChat === from) { renderMessages(); socket.emit('markRead',{withCode:from}); }
  }
  renderFriends();
});
socket.on('messageSent', ({ to, groupId, message }) => {
  const key = groupId || to;
  (state.messages[key] = state.messages[key]||[]).push(message);
  renderMessages();
});
socket.on('messageReacted', ({ id, reactions }) => {
  const key = state.activeGroup || state.activeChat;
  if (state.messages[key]) {
    const m = state.messages[key].find(x => x.id === id);
    if (m) { m.reactions = reactions; renderMessages(); }
  }
});
socket.on('friendOnline', ({ code, online }) => { state.online[code] = online; renderFriends(); });
socket.on('friendAdded', f => {
  if (!state.friends.find(x=>x.code===f.code)) {
    state.friends.push(f);
    state.online[f.code] = f.online;
    renderFriends();
  }
});
socket.on('groupAdded', g => {
  if (!state.groups.find(x=>x.id===g.id)) { state.groups.push(g); renderFriends(); }
});

function doRegister(code, name, pass, photo){
  socket.emit('register', { code, name, pass, photo }, res => {
    if (!res.ok) return toast('Ошибка: '+res.error);
    state.user = res.user;
    state.friends = res.friends;
    state.groups = res.groups || [];
    state.friends.forEach(f => state.online[f.code] = f.online);
    store.set('volna_profile',{code,name,pass,photo});
    $('#authScr').classList.add('hidden');
    $('#main').classList.remove('hidden');
    $('#starCount').textContent = res.user.stars;
    renderFriends();
  });
}

$('#aBtn').onclick = () => {
  const name = $('#nIn').value.trim(), pass = $('#pIn').value;
  if (!name || !pass) return toast('Заполните поля');
  const saved = store.get('volna_profile', null);
  if (saved && saved.name === name) { doRegister(saved.code, name, pass, saved.photo); return; }
  let code = name === 'ADMIN' ? 'ADMIN' : Math.random().toString(36).slice(2,8).toUpperCase();
  doRegister(code, name, pass, null);
};
$('#loBtn').onclick = () => { if (confirm('Выйти?')) { store.set('volna_profile',null); location.reload(); } };

function renderFriends(){
  const list = $('#fl'); if (!list) return;
  const all = [...state.friends.map(f=>({...f,isGroup:false})), ...state.groups.map(g=>({...g,isGroup:true,code:g.id}))];
  if (!all.length) { list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:15px;">Нет чатов<br><br><button class="btn primary" onclick="openAddFriend()" style="max-width:200px;margin:0 auto;padding:10px;">+ Добавить друга</button></div>'; return; }
  list.innerHTML = all.map(f => {
    const ms = state.messages[f.code] || [];
    const last = ms[ms.length-1];
    let preview = 'Нет сообщений';
    if (last) preview = (last.from===state.user.code?'Вы: ':'') + (last.kind==='text'?last.text:'📎');
    return `<div class="fr" onclick="${f.isGroup?`openGroup('${f.code}')`:`openChat('${f.code}')`}">
      <div class="avw"><div class="av">${avFor(f.name,f.photo)}</div>${state.online[f.code]?'<div class="dot"></div>':''}</div>
      <div class="fi">
        <div class="fn">${f.isGroup?'👥 ':''}${esc(f.name)}</div>
        <div class="fl">${esc(preview)}</div>
      </div>
    </div>`;
  }).join('');
}

function openChat(code){
  state.activeChat = code; state.activeGroup = null;
  document.body.classList.add('co2');
  const f = state.friends.find(x=>x.code===code); if (!f) return;
  $('#cempty').style.display = 'none';
  $('#chd').innerHTML = `<button class="bk" onclick="document.body.classList.remove('co2')">←</button>
    <div class="avsm">${avFor(f.name,f.photo)}</div>
    <div style="flex:1" onclick="openProfile('${f.code}')">
      <div class="cn">${esc(f.name)}</div>
      <div class="cs">${state.online[code]?'в сети':'не в сети'}</div>
    </div>`;
  socket.emit('loadHistory',{withCode:code},res=>{
    state.messages[code] = res.history;
    renderMessages();
    socket.emit('markRead',{withCode:code});
  });
}

function openGroup(gid){
  state.activeGroup = gid; state.activeChat = null;
  document.body.classList.add('co2');
  const g = state.groups.find(x=>x.id===gid); if (!g) return;
  $('#cempty').style.display = 'none';
  $('#chd').innerHTML = `<button class="bk" onclick="document.body.classList.remove('co2')">←</button>
    <div class="avsm" style="background:var(--accent);color:#fff">Г</div>
    <div style="flex:1"><div class="cn">${esc(g.name)}</div><div class="cs">${g.members.length} участников</div></div>`;
  socket.emit('loadHistory',{groupId:gid},res=>{ state.messages[gid]=res.history; renderMessages(); });
}

function renderMessages(){
  const key = state.activeGroup || state.activeChat; if (!key) return;
  const ms = state.messages[key] || [];
  const a = $('#msgs');
  if (!ms.length) { a.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:15px;">Напишите первое сообщение</div>'; return; }
  a.innerHTML = ms.map(m => {
    const mine = m.from === state.user.code;
    let reactions = '';
    if (m.reactions && Object.keys(m.reactions).length) {
      reactions = '<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;">' + Object.keys(m.reactions).map(e =>
        `<div style="background:var(--panel);border:.5px solid var(--border);padding:2px 8px;border-radius:12px;font-size:13px;">${e} ${m.reactions[e].length}</div>`
      ).join('')+'</div>';
    }
    return `<div class="msg ${mine?'me':'th'}" ondblclick="quickReact(event,'${m.id}','❤️')" oncontextmenu="showReactionsMenu(event,'${m.id}');return false;">
      <div class="bub">${esc(m.text||'')}</div>
      <div class="mt">${fmtTime(m.ts)}${mine?' ✓✓':''}</div>
      ${reactions}
    </div>`;
  }).join('');
  a.scrollTop = a.scrollHeight;
}

function quickReact(e,id,emoji){
  e.preventDefault();
  socket.emit('reactToMessage',{id,emoji});
  const heart = document.createElement('div');
  heart.className = 'float-heart'; heart.textContent = emoji;
  heart.style.left = e.pageX+'px'; heart.style.top = e.pageY+'px';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(), 800);
}
function showReactionsMenu(e,id){
  e.preventDefault();
  const menu = document.createElement('div');
  menu.className = 'reactions-menu';
  menu.innerHTML = ['👍','❤️','🔥','😂','😢','🎉'].map(em=>`<span onclick="socket.emit('reactToMessage',{id:'${id}',emoji:'${em}'});this.parentNode.remove()">${em}</span>`).join('');
  menu.style.left = Math.min(e.pageX, window.innerWidth-260)+'px';
  menu.style.top = (e.pageY-60)+'px';
  document.body.appendChild(menu);
  setTimeout(()=>{ const close = ()=>{menu.remove();document.removeEventListener('click',close)}; document.addEventListener('click',close); },10);
}

$('#sb2').onclick = () => {
  const t = $('#mi').value.trim(); if (!t) return;
  const payload = { kind:'text', text:t };
  if (state.activeGroup) payload.groupId = state.activeGroup;
  else payload.to = state.activeChat;
  socket.emit('sendMessage', payload);
  $('#mi').value = '';
};
$('#mi').onkeydown = e => { if (e.key==='Enter') $('#sb2').click(); };

/* ==================== ДОБАВЛЕНИЕ ДРУЗЕЙ ==================== */
function openAddFriend(){
  $('#addFriendModal').style.display = 'flex';
  switchAddTab('search');
}
function closeAddFriend(){
  $('#addFriendModal').style.display = 'none';
  if (state.qrScanner) { try { state.qrScanner.stop(); } catch(e){} state.qrScanner = null; }
}

function switchAddTab(tab){
  state.curTab = tab;
  ['search','qr','scan'].forEach(t => {
    $('#view'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('hidden');
    $('#tab'+t.charAt(0).toUpperCase()+t.slice(1)).style.background = 'transparent';
    $('#tab'+t.charAt(0).toUpperCase()+t.slice(1)).style.color = 'var(--text-secondary)';
  });
  $('#view'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.remove('hidden');
  $('#tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).style.background = 'var(--panel)';
  $('#tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).style.color = 'var(--text)';

  if (tab === 'qr') generateMyQR();
  if (tab === 'scan') startQRScanner();
  else if (state.qrScanner) { try { state.qrScanner.stop(); } catch(e){} state.qrScanner = null; }
}

function generateMyQR(){
  if (!state.user) return;
  const code = state.user.code;
  $('#myCodeText').textContent = code;
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(code);
  $('#myQrImg').src = qrUrl;
}

function copyMyCode(){
  if (!state.user) return;
  navigator.clipboard.writeText(state.user.code).then(()=>toast('Код скопирован: '+state.user.code));
}

function searchFriend(){
  const q = $('#searchFriendInput').value.trim();
  if (!q) return toast('Введите имя или код');
  socket.emit('searchUsers', { query: q }, res => {
    if (!res.ok) return toast('Ошибка поиска');
    const box = $('#searchResult');
    if (!res.users.length) { box.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px;font-size:14px;">Никого не найдено</p>'; return; }
    box.innerHTML = res.users.map(u => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--hover);border-radius:10px;margin-bottom:8px;">
        <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;">${avFor(u.name,u.photo)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:15px;">${esc(u.name)}</div>
          <div style="font-size:13px;color:var(--text-secondary);">${esc(u.code)}</div>
        </div>
        <button class="btn primary" style="width:auto;padding:8px 16px;font-size:14px;" onclick="addFriendByCode('${u.code}')">+ Добавить</button>
      </div>
    `).join('');
  });
}

function addFriendByCode(code){
  socket.emit('addFriendByCode', { code }, res => {
    if (!res.ok) return toast(res.error);
    if (!state.friends.find(x=>x.code===res.friend.code)) {
      state.friends.push(res.friend);
      state.online[res.friend.code] = res.friend.online;
    }
    toast('Друг добавлен: '+res.friend.name);
    renderFriends();
    if (state.curTab === 'search') $('#searchResult').innerHTML = '';
    closeAddFriend();
  });
}

function startQRScanner(){
  if (typeof Html5Qrcode === 'undefined') return toast('Загрузка сканера...');
  if (state.qrScanner) return;
  const reader = $('#qrReader');
  reader.innerHTML = '';
  state.qrScanner = new Html5Qrcode('qrReader');
  state.qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    (decoded) => {
      const code = decoded.trim().toUpperCase();
      if (!code) return;
      try { state.qrScanner.stop(); } catch(e){}
      state.qrScanner = null;
      socket.emit('addFriendByCode', { code }, res => {
        if (!res.ok) return toast(res.error);
        if (!state.friends.find(x=>x.code===res.friend.code)) {
          state.friends.push(res.friend);
          state.online[res.friend.code] = res.friend.online;
        }
        toast('Друг добавлен: '+res.friend.name);
        renderFriends();
        closeAddFriend();
      });
    },
    () => {}
  ).catch(err => {
    toast('Камера недоступна');
    console.error(err);
    state.qrScanner = null;
  });
}

/* ==================== МЕНЮ ==================== */
$('#adBtn').onclick = e => { e.stopPropagation(); $('#adM').classList.toggle('hidden'); };
document.addEventListener('click', e => { if (!e.target.closest('#adM') && !e.target.closest('#adBtn')) $('#adM').classList.add('hidden'); });
$('#adM').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#adM').classList.add('hidden');
  if (b.dataset.a === 'addfriend') openAddFriend();
  else if (b.dataset.a === 'group') toast('Скоро');
};

$('#profileBtn').onclick = () => {
  if (!state.user) return;
  const f = state.user;
  $('#profileContent').innerHTML = `
    <div class="profile-top">
      <div class="profile-avatar">${avFor(f.name,f.photo)}</div>
      <div class="profile-name">${esc(f.name)}</div>
      <div class="profile-status online">в сети</div>
    </div>
    <div class="tg-section">
      <div class="tg-row"><div class="tg-row-content"><div class="tg-row-main">${esc(f.name)}</div><div class="tg-row-sub">Имя</div></div></div>
      <div class="tg-row"><div class="tg-row-content"><div class="tg-row-main">@${esc(f.code.toLowerCase())}</div><div class="tg-row-sub">Имя пользователя</div></div></div>
      <div class="tg-row"><div class="tg-row-content"><div class="tg-row-main">${f.stars} ★</div><div class="tg-row-sub">Баланс</div></div></div>
    </div>
  `;
  $('#profileScreen').classList.remove('hidden');
};

function openProfile(code){
  const f = state.friends.find(x=>x.code===code); if (!f) return;
  const online = state.online[f.code];
  $('#profileContent').innerHTML = `
    <div class="profile-top">
      <div class="profile-avatar">${avFor(f.name,f.photo)}</div>
      <div class="profile-name">${esc(f.name)}</div>
      <div class="profile-status ${online?'online':''}">${online?'в сети':'был(а) недавно'}</div>
    </div>
    <div class="tg-section">
      <div class="tg-row"><div class="tg-row-content"><div class="tg-row-main">${esc(f.name)}</div><div class="tg-row-sub">Имя</div></div></div>
      <div class="tg-row"><div class="tg-row-content"><div class="tg-row-main">@${esc(f.code.toLowerCase())}</div><div class="tg-row-sub">Имя пользователя</div></div></div>
    </div>
  `;
  $('#profileScreen').classList.remove('hidden');
}

$('#sbSr').oninput = e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#fl .fr').forEach(el => {
    const n = el.querySelector('.fn')?.textContent.toLowerCase() || '';
    el.style.display = n.includes(q) ? '' : 'none';
  });
};
</script>
