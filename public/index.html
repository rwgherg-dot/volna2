 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>NEXUS</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#09090b;--panel:#18181b;--chat-bg:#000000;--text:#fafafa;--sec:#a1a1aa;--accent:#8b5cf6;--border:#27272a;--hover:#27272a;--in:#18181b;--out:#8b5cf6;--outt:#fff;--glass:rgba(24,24,27,.85);--danger:#ef4444;--gold:#eab308;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[data-theme=light]{--bg:#fff;--panel:#fff;--chat-bg:#f4f4f5;--text:#000;--sec:#71717a;--accent:#8b5cf6;--border:#e4e4e7;--hover:#f4f4f5;--in:#fff;--out:#8b5cf6;--outt:#fff;--glass:rgba(255,255,255,.85)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-size:16px;-webkit-font-smoothing:antialiased}
body{user-select:none;-webkit-touch-callout:none}
input,textarea{user-select:text;font-size:16px;font-family:inherit;outline:none;border:none;background:transparent;color:var(--text)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

.ic{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:18px;height:18px}
.ic.lg{width:44px;height:44px;stroke-width:1.6}

/* Экран авторизации */
.auth-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:50}
.auth{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:center;animation:fadeIn .3s}
.logo{width:96px;height:96px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(139,92,246,.4)}
.brand{font-size:34px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--sec);font-size:15px;text-align:center}
.fld{width:100%;padding:14px 16px;border-radius:12px;background:var(--hover);border:1.5px solid transparent;transition:border-color .2s}
.fld:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;border:none;transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.secondary{background:var(--hover);color:var(--text)}

/* Основное окно */
#main{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:60px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:20}
.bsm{font-weight:900;font-size:22px;letter-spacing:1px}
.stars{background:var(--hover);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px;cursor:pointer}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);background:none;border:none}
.ib:active{background:var(--hover)}
.dd{position:absolute;top:50px;right:0;background:var(--panel);border-radius:16px;padding:6px;display:flex;flex-direction:column;z-index:80;min-width:240px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid var(--border);animation:pop .15s;transform-origin:top right}
.dd button{background:none;color:var(--text);padding:12px 14px;text-align:left;border-radius:10px;font-size:15px;border:none;display:flex;gap:12px;align-items:center;font-weight:600}
.dd button:hover{background:var(--hover)}
.dd .sep{height:1px;background:var(--border);margin:4px 0}

/* Сайдбар и чат */
.body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
#sb{width:100%;max-width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border)}
#fl{flex:1;overflow-y:auto}
.fr{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.fr:hover,.fr.act{background:var(--hover)}
.avw{position:relative;flex-shrink:0}
.av{width:54px;height:54px;border-radius:16px;overflow:hidden;position:relative}
.dot{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:3px solid var(--panel)}
.fi{flex:1;min-width:0}
.fn{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:700}
.fn span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ft{font-size:13px;font-weight:500;color:var(--sec);flex-shrink:0}
.fl{font-size:14px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}

#ca{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--chat-bg)}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:60px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.avsm{width:42px;height:42px;border-radius:12px;overflow:hidden;flex-shrink:0}
.cn{font-size:16px;font-weight:700}
.cs{font-size:13px;color:var(--sec);font-weight:500}
.bk{display:none;background:none;border:none;color:var(--text);padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;flex-direction:column;max-width:80%;animation:pop .15s}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.th{align-self:flex-start;align-items:flex-start}
.bub{padding:10px 14px;border-radius:18px;line-height:1.4;word-break:break-word;white-space:pre-wrap;box-shadow:0 2px 5px rgba(0,0,0,.1);position:relative}
.me .bub{background:var(--out);color:var(--outt);border-bottom-right-radius:4px}
.th .bub{background:var(--in);border:1px solid var(--border);border-bottom-left-radius:4px}
.mt{font-size:11px;opacity:.7;float:right;margin:8px 0 -2px 10px;font-weight:600}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rx div{background:var(--panel);border:1px solid var(--border);padding:3px 8px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
.rmenu{position:fixed;background:var(--panel);border-radius:20px;padding:8px 12px;display:flex;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:250;border:1px solid var(--border);animation:slideUp .15s}
.rmenu span{cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.rmenu span:hover{transform:scale(1.1);background:var(--hover)}
.rmenu .ic{width:22px;height:22px}

/* Аудио плеер */
audio{height:40px;max-width:220px;outline:none;margin-top:4px}

/* Ввод */
.cmp{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);align-items:flex-end;border-top:1px solid var(--border)}
.mi{flex:1;padding:12px 16px;border-radius:20px;background:var(--hover);min-height:44px;max-height:120px;resize:none;line-height:1.4}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.send:active{transform:scale(.9)}
.mic-btn{width:44px;height:44px;border-radius:50%;background:var(--hover);color:var(--text);border:none;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mic-btn.recording{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#cempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sec);background:var(--chat-bg);font-weight:600;font-size:18px}

/* Модалки */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:400;padding:16px}
.modal.open{display:flex}
.mc{width:100%;max-width:380px;background:var(--panel);border-radius:20px;padding:24px;animation:slideUp .2s;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.mtitle{font-size:22px;font-weight:900;text-align:center;margin-bottom:16px}
.tabs{display:flex;background:var(--hover);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--sec)}
.tab.active{background:var(--panel);color:var(--text);box-shadow:0 2px 5px rgba(0,0,0,.1)}

/* Админка и Оплата */
.pay-box{background:var(--hover);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px}
.qr-img{width:200px;height:200px;border-radius:12px;margin:10px auto;display:block}
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);gap:10px}
.admin-input{width:60px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--panel);text-align:center}
.call-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.call-av{width:120px;height:120px;border-radius:50%;background:var(--accent);margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold}
.call-btn{width:60px;height:60px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 10px;cursor:pointer}
.call-btn.end{background:var(--danger)}
.call-btn.accept{background:#22c55e}

@media(max-width:700px){#sb{max-width:none}body.co2 #sb{display:none}body:not(.co2) #ca{display:none}.bk{display:flex}}
</style>
</head>

</defs></svg>

<!-- АВТОРИЗАЦИЯ -->
<div id="authScr" class="auth-wrap">
  <div class="auth">
    <div class="logo"><svg class="ic lg"><use href="#i-logo"/></svg></div>
    <h1 class="brand">NEXUS</h1>
    <p class="sub">Введите имя и пароль. Новое имя — создастся аккаунт.</p>
    <input id="nIn" class="fld" placeholder="Имя" maxlength="24" autocomplete="off">
    <input id="pIn" class="fld" type="password" placeholder="Пароль" maxlength="64">
    <button id="aBtn" class="btn primary">Войти</button>
  </div>
</div>

<!-- ОСНОВНОЕ -->
<div id="main" class="hidden">
  <header class="top">
    <div class="bsm">NEXUS</div>
    <div class="stars" onclick="openStars()"><svg class="ic sm" style="stroke:var(--gold)"><use href="#i-star"/></svg><span id="starCount">0</span></div>
    <div style="margin-left:auto;position:relative;display:flex;gap:4px">
      <button id="adminBtn" class="ib hidden" onclick="openAdminPanel()" aria-label="Админ"><svg class="ic" style="stroke:var(--accent)"><use href="#i-admin"/></svg></button>
      <button id="menuBtn" class="ib" aria-label="Меню"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div id="adM" class="dd hidden">
        <button id="loBtn" style="color:var(--danger)"><svg class="ic sm"><use href="#i-exit"/></svg> Выйти</button>
      </div>
    </div>
  </header>
  <div class="body">
    <aside id="sb">
      <div id="fl"></div>
    </aside>
    <main id="ca">
      <div id="chd" class="ch"></div>
      <div id="msgs" class="msgs"></div>
      <div class="cmp">
        <button id="micBtn" class="mic-btn" title="Голосовое"><svg class="ic"><use href="#i-mic"/></svg></button>
        <textarea id="mi" class="mi" placeholder="Сообщение..." rows="1"></textarea>
        <button id="sendBtn" class="send"><svg class="ic"><use href="#i-arrow-up"/></svg></button>
      </div>
      <div id="cempty"><span>Выберите чат</span></div>
    </main>
  </div>
</div>

<!-- МОДАЛКА ОПЛАТЫ -->
<div id="starsModal" class="modal"><div class="mc">
  <h3 class="mtitle">Пополнение звёзд</h3>
  <div class="pay-box">
    <p style="margin-bottom:10px;font-weight:600">Переведите нужную сумму и нажмите кнопку.</p>
    <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block">
      <!-- Ваш QR код из Т-Банка (ссылка на изображение или генерация) -->

  </div>
  <p class="sub" style="margin-bottom:12px;font-size:14px">После перевода нажмите кнопку ниже. Админ проверит чек и начислит звёзды.</p>
  <input id="payAmount" class="fld" placeholder="Сколько звёзд вы купили? (напр. 50)" type="number" style="margin-bottom:10px">
  <button class="btn primary" onclick="requestStars()">Я оплатил(а)</button>
  <button class="btn secondary" onclick="closeStars()" style="margin-top:10px">Отмена</button>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const fmtTime = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function toast(t){
  const e = document.createElement('div'); e.textContent = t;
  e.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:30px;font-size:15px;font-weight:600;z-index:999;max-width:90%;text-align:center;border:1px solid var(--border);box-shadow:0 5px 20px rgba(0,0,0,.5)';
  document.body.appendChild(e); setTimeout(()=>e.remove(),2500);
}
function avFor(n,p){
  if (p) return `<img src="${p}" style="width:100%;height:100%;object-fit:cover">`;
  const raw = (n||'?').trim()||'?', cs=['#8b5cf6','#ec4899','#f59e0b','#10b981'];
  let x=0; for (const c of raw) x+=c.charCodeAt(0);
  return `<div style="width:100%;height:100%;background:${cs[x%cs.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px">${esc(raw[0].toUpperCase())}</div>`;
}

const state = {user:null,friends:[],groups:[],messages:{},activeChat:null,activeGroup:null,online:{},isRecording:false,mediaRecorder:null,audioChunks:[],callData:null};
const activeKey = () => state.activeGroup || state.activeChat;
const socket = io();

// Инициализация аудио контекста для WebRTC
let pc;

socket.on('connect', () => {
  const s = store.get('nexus_profile',null);
  if (s) doRegister(s.name, s.pass, true);
});

socket.on('newMessage', ({from,message}) => {
  const key = message.groupId || from;
  (state.messages[key] ||= []).push(message);
  if (activeKey()===key) renderMessages();
  renderFriends();
});
socket.on('messageSent', ({to,groupId,message}) => {
  const key = groupId || to;
  (state.messages[key] ||= []).push(message);
  if (activeKey()===key) renderMessages();
  renderFriends();
});
socket.on('messageDeleted', ({id, key}) => {
  if(state.messages[key]) {
    state.messages[key] = state.messages[key].filter(m => m.id !== id);
    if(activeKey() === key) renderMessages();
    renderFriends();
  }
});
socket.on('friendOnline', ({code,online}) => { state.online[code]=online; renderFriends(); if(state.activeChat===code) updateChatHeader(); });
socket.on('friendAdded', f => { if (!state.friends.find(x=>x.code===f.code)) state.friends.push(f); renderFriends(); });
socket.on('groupAdded', g => { if (!state.groups.find(x=>x.id===g.id)) state.groups.push(g); renderFriends(); });
socket.on('nftReceived', ({nft}) => { toast('Вам подарен NFT!'); });

// АДМИН СОБЫТИЯ
socket.on('adminUsers', (users) => renderAdminUsers(users));
socket.on('errorMsg', (msg) => toast(msg));

function doRegister(name, pass, silent=false){
  socket.emit('register',{name, pass},res => {
    if (!res || !res.ok) {
      if (silent) { store.set('nexus_profile',null); }
      return toast('Ошибка: '+(res?.error||'нет связи'));
    }
    state.user=res.user; state.friends=res.friends||[]; state.groups=res.groups||[];
    store.set('nexus_profile',{name,pass});
    $('#authScr').classList.add('hidden'); $('#main').classList.remove('hidden');
    $('#starCount').textContent=res.user.stars;
    if(state.user.code === 'ADMIN') $('#adminBtn').classList.remove('hidden');
    renderFriends();
  });
}

$('#aBtn').onclick = () => {
  const name=$('#nIn').value.trim(), pass=$('#pIn').value;
  if (!name||!pass) return toast('Заполните поля');
  doRegister(name, pass);
};
$('#loBtn').onclick = () => { if (confirm('Выйти?')) { store.set('nexus_profile',null); location.reload(); } };

// Сайдбар
function renderFriends(){
  const list=$('#fl'); if(!list||!state.user) return;
  const all=[...state.friends, ...state.groups];
  list.innerHTML=all.map(f=>{
    const act=f.code===activeKey()?' act':'';
    const last=(state.messages[f.code]||[]).pop();
    return `<div class="fr${act}" onclick="${f.members?'openGroup':'openChat'}('${f.code}')">
      <div class="avw"><div class="av">${avFor(f.name,null)}</div>${!f.members&&state.online[f.code]?'<div class="dot"></div>':''}</div>
      <div class="fi"><div class="fn"><span>${esc(f.name)}</span><span class="ft">${last?fmtTime(last.ts):''}</span></div>
      <div class="fl">${last ? (last.text ? esc(last.text).slice(0,30) : '[медиа]') : 'Нет сообщений'}</div></div></div>`;
  }).join('');
}

// Чат
function openChat(code){
  state.activeChat=code; state.activeGroup=null; showChat();
  socket.emit('loadHistory',{withCode:code},res=>{ state.messages[code]=res.history||[]; renderMessages(); });
}
function openGroup(gid){
  state.activeGroup=gid; state.activeChat=null; showChat();
  socket.emit('loadHistory',{groupId:gid},res=>{ state.messages[gid]=res.history||[]; renderMessages(); });
}
function showChat(){ document.body.classList.add('co2'); $('#cempty').style.display='none'; updateChatHeader(); renderFriends(); }
function updateChatHeader(){
  const back='<button class="bk" onclick="closeChat()"><svg class="ic"><use href="#i-arrow-left"/></svg></button>';
  if (state.activeChat){
    const f=state.friends.find(x=>x.code===state.activeChat); if(!f) return;
    $('#chd').innerHTML=`${back}<div class="avsm">${avFor(f.name,null)}</div><div style="flex:1"><div class="cn">${esc(f.name)}</div></div>
    <button class="ib" onclick="startCall('${f.code}','${esc(f.name)}')"><svg class="ic"><use href="#i-phone"/></svg></button>`;
  } else if (state.activeGroup){
    const g=state.groups.find(x=>x.id===state.activeGroup);
    $('#chd').innerHTML=`${back}<div class="avsm">${avFor(g.name,null)}</div><div style="flex:1"><div class="cn">${esc(g.name)}</div></div>`;
  }
}

const REACTIONS = { like:'<svg class="ic"><use href="#i-check"/></svg>', heart:'<svg class="ic" style="stroke:#ef4444"><use href="#i-heart"/></svg>', fire:'<svg class="ic" style="stroke:#f59e0b"><use href="#i-fire"/></svg>' };

function renderMessages(){
  const key=activeKey(); if(!key) return;
  const ms=state.messages[key]||[], a=$('#msgs');
  a.innerHTML=ms.map(m=>{
    const mine=m.from===state.user.code;
    const rx=m.reactions&&Object.keys(m.reactions).length?'<div class="rx">'+Object.keys(m.reactions).map(k=>`<div>${REACTIONS[k]||k} ${m.reactions[k].length}</div>`).join('')+'</div>':'';
    
    // Голосовое или текст
    let content = esc(m.text||'');
    if(m.kind==='voice') content = `<audio controls src="${m.text}"></audio>`;
    
    return `<div class="msg ${mine?'me':'th'}" data-id="${m.id}" oncontextmenu="showMenu(event,'${m.id}','${mine}')">
      <div class="bub">${content}<span class="mt">${fmtTime(m.ts)}</span></div>${rx}</div>`;
  }).join('');
  a.scrollTop = a.scrollHeight;
}

function showMenu(e, id, mine){
  e.preventDefault(); document.querySelectorAll('.rmenu').forEach(m=>m.remove());
  const menu=document.createElement('div'); menu.className='rmenu';
  let html = Object.entries(REACTIONS).map(([k,svg])=>`<span onclick="react('${id}','${k}')">${svg}</span>`).join('');
  if(mine) html += `<span onclick="deleteMsg('${id}')" style="color:var(--danger)"><svg class="ic"><use href="#i-trash"/></svg></span>`;
  menu.innerHTML = html;
  menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-200))+'px';
  menu.style.top=Math.max(10,e.clientY-60)+'px';
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click', ()=>menu.remove(), {once:true}), 100);
}
function react(id, emoji){ socket.emit('reactToMessage',{id,emoji}); }
function deleteMsg(id){ socket.emit('deleteMessage',{id}); }

// Отправка текста
$('#sendBtn').onclick=()=>{
  const t=$('#mi').value.trim(); if(!t) return;
  const p={kind:'text',text:t};
  state.activeGroup?p.groupId=state.activeGroup:p.to=state.activeChat;
  socket.emit('sendMessage',p);
  $('#mi').value='';
};

// Голосовые сообщения
$('#micBtn').onclick = async () => {
  if (state.isRecording) {
    state.mediaRecorder.stop();
    state.isRecording = false;
    $('#micBtn').classList.remove('recording');
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.mediaRecorder = new MediaRecorder(stream);
      state.audioChunks = [];
      state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          const p = { kind: 'voice', text: reader.result };
          state.activeGroup ? p.groupId = state.activeGroup : p.to = state.activeChat;
          socket.emit('sendMessage', p);
        };
      };
      state.mediaRecorder.start();
      state.isRecording = true;
      $('#micBtn').classList.add('recording');
    } catch(e) { toast('Нет доступа к микрофону'); }
  }
};

// Модалки
function openStars(){ $('#starsModal').classList.add('open'); }
function closeStars(){ $('#starsModal').classList.remove('open'); }
function requestStars(){
  const amt = $('#payAmount').value;
  if(!amt) return toast('Укажите сумму');
  socket.emit('requestStars', { amount: amt }, res => {
    if(res.ok) { toast('Заявка отправлена админу!'); closeStars(); }
  });
}

// АДМИНКА
function openAdminPanel(){ socket.emit('getAdminUsers'); $('#adminModal').classList.add('open'); }
function closeAdminPanel(){ $('#adminModal').classList.remove('open'); }
function renderAdminUsers(users){
  $('#adminUsersList').innerHTML = users.map(u => `
    <div class="admin-row">
      <div>
        <div style="font-weight:700">${esc(u.name)} <span style="color:var(--sec);font-size:12px">(${u.code})</span></div>
        <div style="color:var(--gold);font-size:14px;font-weight:700">★ ${u.stars}</div>
      </div>
      <div style="display:flex;gap:6px">
        <input type="number" id="adminAmt_${u.code}" class="admin-input" placeholder="+100">
        <button class="btn primary" style="padding:6px 12px;width:auto" onclick="giveStars('${u.code}')">Выдать</button>
      </div>
    </div>
  `).join('');
}
function giveStars(code){
  const amt = $(`#adminAmt_${code}`).value;
  if(!amt) return;
  socket.emit('adminGiveStars', { target: code, amount: amt }, res => {
    if(res.ok) { toast('Звёзды выданы!'); socket.emit('getAdminUsers'); }
  });
}

// ЗВОНКИ (WebRTC)
let localStream = null;
async function setupPeer() {
  const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  pc = new RTCPeerConnection(configuration);
  pc.onicecandidate = event => {
    if (event.candidate && state.callData) {
      socket.emit('iceCandidate', { to: state.callData.peer, candidate: event.candidate });
    }
  };
  pc.ontrack = event => {
    let audio = document.getElementById('remoteAudio');
    if (!audio) { audio = document.createElement('audio'); audio.id = 'remoteAudio'; document.body.appendChild(audio); }
    audio.srcObject = event.streams[0];
    audio.play();
  };
  if(!localStream) {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

async function startCall(peerCode, peerName) {
  state.callData = { peer: peerCode, name: peerName, isCaller: true };
  $('#callName').textContent = peerName;
  $('#callStatus').textContent = 'Звоним...';
  $('#callModal').classList.remove('hidden');
  $('#acceptCallBtn').classList.add('hidden');
  await setupPeer();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('callUser', { to: peerCode, offer });
}

socket.on('incomingCall', async ({ from, offer }) => {
  const friend = state.friends.find(f => f.code === from);
  state.callData = { peer: from, name: friend ? friend.name : 'Неизвестный', isCaller: false, offer };
  $('#callName').textContent = state.callData.name;
  $('#callStatus').textContent = 'Входящий звонок...';
  $('#callModal').classList.remove('hidden');
  $('#acceptCallBtn').classList.remove('hidden');
});

async function acceptCall() {
  $('#acceptCallBtn').classList.add('hidden');
  $('#callStatus').textContent = 'Соединение...';
  await setupPeer();
  await pc.setRemoteDescription(new RTCSessionDescription(state.callData.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answerCall', { to: state.callData.peer, answer });
}

socket.on('callAnswered', async ({ answer }) => {
  $('#callStatus').textContent = 'На связи';
  await pc.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('iceCandidate', async ({ candidate }) => {
  if (pc) await pc.addIceCandidate(new RTCIceCandidate(candidate));
});

socket.on('callEnded', () => { endCall(); });

function endCall() {
  $('#callModal').classList.add('hidden');
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (state.callData) { socket.emit('endCall', { to: state.callData.peer }); state.callData = null; }
  const audio = document.getElementById('remoteAudio'); if(audio) audio.remove();
}
</script>
