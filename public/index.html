 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tear Down — на двоих</title>
<style>
  body { margin:0; background:#1a1a2e; color:#eee; font-family:Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; user-select:none; }
  h1 { margin:10px; font-size:22px; }
  #hud { display:flex; gap:40px; font-size:16px; margin-bottom:8px; }
  canvas { background:#0f3460; border:3px solid #16213e; border-radius:8px; display:block; }
  #controls { margin:10px; font-size:13px; color:#aaa; text-align:center; line-height:1.6; }
  .p1 { color:#4fc3f7; } .p2 { color:#ff7043; }
  button { margin-top:8px; padding:8px 16px; font-size:14px; background:#4fc3f7;
           color:#000; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<h1>🔨 Tear Down — на двоих</h1>
<div id="hud">
  <span class="p1">Игрок 1: <b id="s1">0</b></span>
  <span class="p2">Игрок 2: <b id="s2">0</b></span>
</div>
<canvas id="game" width="800" height="500"></canvas>
<div id="controls">
  <b class="p1">P1:</b> A/D — движение, W — прыжок, S — удар вниз &nbsp;|&nbsp;
  <b class="p2">P2:</b> ←/→ — движение, ↑ — прыжок, ↓ — удар вниз
</div>
<button id="reset">🔄 Перестроить башню</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 40, GRAVITY = 0.5;
const s1El = document.getElementById('s1');
const s2El = document.getElementById('s2');

let blocks = [], particles = [];

const players = [
  { x: W*0.25, y: GROUND-40, w:40, h:40, vx:0, vy:0, color:'#4fc3f7',
    onGround:true, score:0, jumpCd:0, downCd:0, hitDown:false,
    keys:{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS'} },
  { x: W*0.75, y: GROUND-40, w:40, h:40, vx:0, vy:0, color:'#ff7043',
    onGround:true, score:0, jumpCd:0, downCd:0, hitDown:false,
    keys:{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown'} }
];

const input = [{left:false,right:false,up:false,down:false},
               {left:false,right:false,up:false,down:false}];

function buildTower() {
  blocks = [];
  const bw = 45, bh = 22;
  const baseX = W/2 - bw*2;
  for (let row = 0; row < 12; row++) {
    for (let col = 0; col < 4; col++) {
      blocks.push({
        x: baseX + col*bw + (row%2 ? bw/2 : 0) - (row%2 ? bw/4 : 0),
        y: GROUND - (row+1)*bh - row*1,
        w: bw-2, h: bh-2, vx:0, vy:0, broken:false
      });
    }
  }
}
buildTower();

document.addEventListener('keydown', e => {
  players.forEach((p,i) => {
    for (const k in p.keys) if (p.keys[k]===e.code) { input[i][k]=true; e.preventDefault(); }
  });
});
document.addEventListener('keyup', e => {
  players.forEach((p,i) => {
    for (const k in p.keys) if (p.keys[k]===e.code) { input[i][k]=false; e.preventDefault(); }
  });
});
document.getElementById('reset').onclick = () => {
  buildTower();
  players.forEach(p => { p.score = 0; });
};

function rectHit(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function step() {
  // Игроки
  players.forEach((p,i) => {
    const speed = 5;
    p.vx = 0;
    if (input[i].left) p.vx = -speed;
    if (input[i].right) p.vx = speed;
    p.x += p.vx;
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > W) p.x = W - p.w;

    p.vy += GRAVITY;
    p.y += p.vy;
    if (p.y + p.h >= GROUND) { p.y = GROUND-p.h; p.vy = 0; p.onGround = true; }
    else p.onGround = false;

    if (input[i].up && p.onGround && p.jumpCd<=0) { p.vy=-11; p.jumpCd=12; p.onGround=false; }
    if (p.jumpCd>0) p.jumpCd--;

    p.hitDown = false;
    if (input[i].down && p.downCd<=0) { p.vy=12; p.downCd=20; p.hitDown=true; }
    if (p.downCd>0) p.downCd--;
  });

  // Блоки
  for (const b of blocks) {
    if (b.broken) continue;
    b.vy += GRAVITY;
    b.x += b.vx; b.y += b.vy;
    b.vx *= 0.98;
    if (b.y + b.h >= GROUND) {
      b.y = GROUND-b.h; b.vy = 0; b.vx *= 0.7;
      if (Math.abs(b.vx) < 0.2) b.vx = 0;
    }
  }

  // Игрок ↔ блок
  players.forEach(p => {
    for (const b of blocks) {
      if (b.broken || !rectHit(p,b)) continue;
      const dx = (b.x+b.w/2) - (p.x+p.w/2);
      const dy = (b.y+b.h/2) - (p.y+p.h/2);
      if (Math.abs(dx) > Math.abs(dy)) {
        b.vx = Math.sign(dx) * 8;
      } else {
        if (dy < 0) { b.vy = 10; if (p.hitDown) b.vx = (Math.random()-0.5)*6; }
        else b.vy = -6;
      }
      p.score++;
      p.x -= Math.sign(dx) * 2;
    }
  });

  // Блок ↔ блок
  for (let i=0; i<blocks.length; i++) {
    const a = blocks[i]; if (a.broken) continue;
    for (let j=i+1; j<blocks.length; j++) {
      const b = blocks[j]; if (b.broken) continue;
      if (!rectHit(a,b)) continue;
      const oX = Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x);
      const oY = Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y);
      if (oY < oX) {
        const push = oY/2;
        if (a.y < b.y) { a.y -= push; b.y += push; }
        else { a.y += push; b.y -= push; }
        a.vy = 0; b.vy = 0;
      }
    }
  }

  // Частицы
  particles = particles.filter(pt => pt.life > 0);
  particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life--; });

  s1El.textContent = players[0].score;
  s2El.textContent = players[1].score;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#16213e'; ctx.fillRect(0,H-40,W,40);

  for (const b of blocks) {
    if (b.broken) continue;
    const t = Math.min(1, (GROUND - b.y) / 300);
    ctx.fillStyle = `rgb(${Math.floor(80+t*150)},${Math.floor(120-t*60)},${Math.floor(200-t*120)})`;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.strokeRect(b.x,b.y,b.w,b.h);
  }

  for (const p of players) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = '#000';
    ctx.fillRect(p.x+10, p.y+12, 6,6);
    ctx.fillRect(p.x+24, p.y+12, 6,6);
  }

  for (const pt of particles) {
    ctx.globalAlpha = pt.life/30;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 3, 3);
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(50, now-last); last = now;
  const steps = Math.ceil(dt / 16);
  for (let i=0; i<steps; i++) step();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
